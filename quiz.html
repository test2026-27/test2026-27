<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台電企管填充題練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 練習工具：上方摘要列 → 分頁 → 單題作答卡，手機單欄 */
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d9e0e7;
  --accent:#1d5c86; --accent-soft:#e3eef6;
  --ok:#1f7a4d; --ok-soft:#e2f3ea; --bad:#b4352c; --bad-soft:#fbe6e3; --warn:#9a6a00; --warn-soft:#fbf1d6;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#97a5b3; --line:#2c3743;
    --accent:#6fb2e0; --accent-soft:#1d3346;
    --ok:#5cc792; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1e1c; --warn:#e3b54c; --warn-soft:#352b12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#97a5b3; --line:#2c3743;
  --accent:#6fb2e0; --accent-soft:#1d3346;
  --ok:#5cc792; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1e1c; --warn:#e3b54c; --warn-soft:#352b12;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-size:1.5rem;margin:0;line-height:1.3;text-wrap:balance}
h2{font-family:var(--f-display);font-size:1.15rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.badstat b{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:.85rem;color:var(--muted);min-width:4.5em}
.chip{appearance:none;font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0d1a24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1a24}}
.btn{appearance:none;font:inherit;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .btn{color:#0d1a24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0d1a24}}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-size:1.05rem;line-height:2.1}
.blank{font:inherit;font-size:16px;width:9em;max-width:100%;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);padding:0 6px;margin:0 2px;border-radius:4px 4px 0 0}
.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-soft);border-left:5px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border-left:5px solid var(--bad)}
.feedback .verdict{font-weight:700}
.ans{font-size:.95rem}
.ans em{font-style:normal;font-weight:700}
.hint{font-size:.85rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item.essay{border-left-color:var(--line)}
.item.essay[data-rate="good"]{border-left-color:var(--ok)}
.item.essay[data-rate="mid"]{border-left-color:var(--warn)}
.item.essay[data-rate="bad"]{border-left-color:var(--bad)}
.meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
textarea{font:inherit;font-size:16px;width:100%;min-height:5em;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical}
ol.subq{margin:0;padding-left:1.6em}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate .chip[data-v="good"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.rate .chip[data-v="mid"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.rate .chip[data-v="bad"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.sync{font-size:.78rem;color:var(--muted)}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.fold>summary{list-style:none;cursor:pointer;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"展開";font-size:.8rem;color:var(--accent);flex:none}
details.fold[open]>summary::after{content:"收合"}
details.fold>summary b{color:var(--ink);font-weight:700}
.ygroup>summary{font-size:1rem}
.navrow{justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
#qcard{display:flex;flex-direction:column;gap:12px}
#qcard[hidden]{display:none}
details.fold .foldbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.qtext{font-size:1rem}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">
  <header class="row" style="justify-content:space-between;align-items:flex-end">
    <div>
      <a href="./" style="font-size:.85rem;color:var(--accent);text-decoration:none">← 回讀書計畫</a>
      <h1>台電僱員企管概論・填充題練習</h1>
    </div>
    <span class="sync" id="sync">紀錄儲存中…</span>
  </header>


  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-practice" aria-selected="true" data-view="practice">填充練習</button>
    <button class="tab" role="tab" id="tab-book" aria-selected="false" data-view="book">錯題本</button>
    <button class="tab" role="tab" id="tab-essay" aria-selected="false" data-view="essay">問答題</button>
  </nav>

  <!-- 填充練習 -->
  <section class="panel" id="view-practice">
    <div class="card" id="qcard" hidden></div>
    <details class="fold" id="setup"><summary><span>出題設定：<b id="setupSum">115 年・依題號</b></span></summary><div class="foldbody">
      <div class="row"><span class="label">年度</span>
        <div class="row" id="yearChips"></div>
      </div>
      <div class="row"><span class="label">出題</span>
        <button class="chip" id="mSeq" aria-pressed="true">依題號</button>
        <button class="chip" id="mRand" aria-pressed="false">隨機</button>
        <button class="chip" id="mNew" aria-pressed="false">只出沒練過的</button>
      </div>
      <div class="row"><button class="btn" id="startBtn">開始練習</button><span class="hint" id="poolInfo"></span></div>
    </div></details>
  <details class="fold" id="statsFold"><summary><span>練習紀錄：已練 <b id="sumDone">0</b> 題・答對率 <b id="sumAcc">—</b>・錯題 <b id="sumBook">0</b></span></summary><div class="foldbody">
  <section class="stats" aria-label="練習摘要">
    <div class="stat"><b id="sDone">0</b><span>已練過題數 / 240</span></div>
    <div class="stat"><b id="sAcc">—</b><span>答對率</span></div>
    <div class="stat badstat"><b id="sBook">0</b><span>錯題本題數</span></div>
    <div class="stat"><b id="sEssay">0</b><span>問答題已熟練</span></div>
  </section>
  <p class="sub">題庫：105–115 年（含 107 年 5 月、12 月）共 240 題填充題，依台電官方解答批改。</p>
  </div></details>
  </section>

  <!-- 錯題本 -->
  <section class="panel" id="view-book" hidden>
    <div class="card row" style="justify-content:space-between">
      <div><h2>錯題本</h2><p class="sub">答錯自動收進來，錯題練習連續答對 2 次自動移出。</p></div>
      <div class="row"><button class="btn" id="bookPractice">練習錯題</button><button class="btn ghost" id="bookCopy">複製錯題清單</button></div>
    </div>
    <div class="list" id="bookList"></div>
  </section>

  <!-- 問答題 -->
  <section class="panel" id="view-essay" hidden>
    <div class="card">
      <h2>問答題自我檢核</h2>
      <p class="sub">官方沒有公布問答題參考答案，這裡用來標記熟練度並寫下自己的答題要點。</p>
      <div class="row" style="margin-top:8px"><span class="label">年度</span><div class="row" id="essayYears"></div></div>
      <div class="row" style="margin-top:6px"><span class="label">篩選</span>
        <button class="chip" data-ef="all" aria-pressed="true">全部</button>
        <button class="chip" data-ef="todo" aria-pressed="false">未標記</button>
        <button class="chip" data-ef="bad" aria-pressed="false">不會／不熟</button>
      </div>
    </div>
    <div class="list" id="essayList"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 台電新進僱用人員 企業管理概論 填充題題庫（105–115，含107年5月/12月）
// q: 題目文字，以 ____ 標示空格；a: 每個空格的可接受答案（依官方解答）
// unordered: true 表示多個空格順序可對調（官方註明以頓號分隔者）
const FILL = [
// ===== 115 =====
{y:"115",n:1,q:"「通貨膨脹率」與「失業率」的總和稱之為____指數。",a:[["痛苦","悲慘","民生痛苦"]]},
{y:"115",n:2,q:"對於主動代表公司於外部活動獲得殊榮的員工，公司(管理者)給予額外獎金之措施，是操作制約理論(Operant Conditioning Theory)中的____激勵方式。",a:[["正增強","正向增強","正向強化","積極增強","正面增強","正強化"]]},
{y:"115",n:3,q:"依據羅賓斯(Robbins)提出之人際溝通的過程，收訊者透過媒介接收到發訊者訊息，將所接受的訊息予以翻譯、說明，轉換成他們可以理解的意思，此過程稱為____。",a:[["解碼","轉譯","訊息解碼","Decoding"]]},
{y:"115",n:4,q:"產品生命週期模型(Product Life Cycle)中，____期因為產品銷售量及利潤已達最高，行銷著重於提醒性廣告，提醒消費者產品還存在，此階段通常是產品生命週期中最久的階段。",a:[["成熟","Maturity"]]},
{y:"115",n:5,q:"服務與實體產品之間的差異主要表現在 4 項特性：____性、不可分離性、易變性、易逝性。",a:[["無形"]]},
{y:"115",n:6,q:"常見的市場區隔變數包含地理變數、____變數、心理變數，以及行為變數。",a:[["人口","人口統計"]]},
{y:"115",n:7,q:"財務四大報表中的____表呈現企業在特定會計期間內發生之收入、費用、損失、利益，反映企業於該連續期間的經營績效。",a:[["損益","綜合損益","利潤","經營成果","收益支出"]]},
{y:"115",n:8,q:"為了讓員工培養多元技能並降低工作無聊程度，將員工定期或不定期轉換工作稱為____。",a:[["工作輪調","部門輪調","職位輪調","內部調動","職務輪換","職務輪調","輪值","Job rotation"]]},
{y:"115",n:9,q:"整合式成長策略分為 2 種：____整合是指廠商整合上游或下游；____整合是指與相關產業的其他組織(通常是競爭者)結合。（每格 1 分）",a:[["垂直"],["水平"]]},
{y:"115",n:10,q:"組織圖可以用來視覺化呈現組織結構的 4 項資訊：管理層級、____、任務、分工。",a:[["指揮鏈"]]},
{y:"115",n:11,q:"「員工普遍具有良好決策能力」符合麥克葛羅格(D. McGregor)的____理論觀點。",a:[["Y"]]},
{y:"115",n:12,q:"麥可波特(M. Porter)所發展的競爭策略架構，提出以現有企業間的競爭強度、供應商的議價能力、採購者的議價能力、替代性產品的壓力、潛在競爭者的威脅等 5 大項，作為對現有企業經營重要影響因素，來分析企業競爭力。此產業結構分析工具被稱為____分析。",a:[["五力","五心","5力","5心","競爭定位"]]},
{y:"115",n:13,q:"____代表影響企業決策價值與方向的標準，是企業在善盡法律與經濟義務外，去追求長期對社會有益的目標。",a:[["社會責任","企業社會責任","CSR","Corporate Social Responsibility"]]},
{y:"115",n:14,q:"專家意見、綜合銷售員意見及顧客意見評量等均屬於____預測技術，是運用具專業知識的個人或團體之意見或判斷去預測未來可能結果。",a:[["質化","質性","定性"]]},
{y:"115",n:15,q:"當同時有 2 個目標都是組織中個人所期望的事物，但實際上只能得其一，便產生「魚與熊掌」無法兼得的____衝突。",a:[["雙趨"]]},
{y:"115",n:16,q:"總體環境不會直接影響企業，但會透過競爭環境因素間接影響企業的運作，又稱為 PESTEL，包含____、經濟、社會文化、____、自然環境等因素、法律、人口統計、全球化國際局勢等。（每格 1 分）",a:[["政治"],["科技"]]},
{y:"115",n:17,q:"生產作業管理所運用之多種生產規劃與控制方法中包含 EOQ 及 PERT，其中 EOQ 為____的英文簡稱，PERT 為____的英文簡稱。（請填入中文專有名詞，每格 1 分）",a:[["經濟訂購量"],["計畫評核術","計劃評核術"]]},
{y:"115",n:18,q:"行銷哲學的演進分為下列 5 階段：生產觀念(專注製造、大量生產與降低成本) →____(著重產品設計) →銷售觀念(專注銷售管理) →____(重視顧客需求，競爭優勢 4P) →社會行銷(將社會大眾權益納入行銷活動)。（每格 1 分）",a:[["產品觀念","產品"],["行銷觀念","行銷"]]},
{y:"115",n:19,q:"某公司的稅後淨利為$2,000,000，總資產週轉率為 3.0，純益率為 4 %，則該公司的總資產報酬率(ROA)為____%。",a:[["12"]]},
{y:"115",n:20,q:"麥肯錫顧問公司提出 7 大要素的觀念架構(7S Model)來診斷一家公司的經營績效，包含策略(Strategy)、結構(Structure)、系統(System)、風格(Style)、人員(Staff)、技術(Skill)與共享價值(Shared Value)，其中____位於此 7 項要素之中樞地位。",a:[["共享價值","Shared Value","共享價值觀"]]},
// ===== 114 =====
{y:"114",n:1,q:"我國「公司法」第 1 條規定：以營利為目的，依照本法組織、登記、成立之____法人，稱為公司。",a:[["社團"]]},
{y:"114",n:2,q:"依據泰勒(F. Taylor)的差別計件工資制(Differential Piece Rate Plan)，A 公司冰品部的標準工時為 4 小時，標準工作件數為生產 40 支冰棒，如未達標準，生產每支冰棒可獲工資 5 元，達成標準，每支可獲工資 10 元，假設員工甲工作 4 小時共生產 80 支冰棒，工資應為____元。",a:[["800","八百","八佰","捌佰"]]},
{y:"114",n:3,q:"工廠老闆透過錄影記錄員工在工作過程中的各項作業後，再就這些紀錄加以分析、歸納與分類，最後整理成工作說明書與工作規範(書)，此係工作分析(Job Analysis)方法中的____法。",a:[["觀察","觀察分析","實地觀察"]]},
{y:"114",n:4,q:"服務金三角(Service Triangle)係對服務業的行銷活動提出整合性之歸納，其面向包含外部行銷、內部行銷及____行銷。",a:[["互動","Interactive"]]},
{y:"114",n:5,q:"小余和小白在同一間公司服務，但為不同部門且不同層級的人員，以組織正式溝通(Formal Communication)的流向分類，2 人在公司內部之溝通稱為____溝通。",a:[["斜向","交叉","Diagonal","斜行"]]},

{y:"111",n:5,q:"學者凱茲(Katz)將管理者的能力劃分為 3 類，其中對於基層管理者而言____能力極為重要，因為其時常與基層員工直接接觸，需引導部屬並發現問題。",a:[["技術","技術性"]]},
{y:"111",n:6,q:"泰勒(Taylor)被譽為科學管理之父，並提出實行____管理，透過日常事務充分授權部屬，可讓管理者有更多時間注意市場競爭，及處理突發或重要的事務。",a:[["例外"]]},
{y:"111",n:7,q:"莫爾斯(J. Morse)與洛希(J. Lorsch)所提出的____理論為人性理論的權變觀點，其認為 X 或 Y 理論都不是絕對，人與環境皆會隨時改變，主要目標為尋求人、工作和組織間的完美搭配。",a:[["超Y","super Y"]]},
{y:"111",n:8,q:"工作特性模型(JCM)讓管理者可以瞭解到工作核心構面與員工心理狀態之間的關係，而工作核心構面中的____性會讓員工對工作結果負責。",a:[["自主"]]},
{y:"111",n:9,q:"本國景氣對策信號亦稱為景氣燈號，國民可據以瞭解目前總體經濟狀況，當綜合判斷分數為 17 至 22，即燈號為____燈，代表景氣短期內可能轉穩或衰退，政府可適時採取擴張措施。",a:[["黃藍"]]},
{y:"111",n:10,q:"____性失業係指當人們離職想轉換新工作時，可能因就業市場信息不流通等原因，需要花費一段時間才能找到新的工作，於是造成暫時性的失業現象。",a:[["摩擦","frictional","過渡","transitional"]]},
{y:"111",n:11,q:"根據顧林納(Greiner)提出組織成長階段理論，認為組織成長歷程中會遭逢許多危機和挑戰，依該理論所述，組織第一階段是經由____成長。",a:[["創造力","創造"]]},
{y:"111",n:12,q:"由競爭力大師波特(M. Porter)所提出的五力分析，係包含新進入者的威脅、供應商的議價能力、____、替代品的威脅以及現存產業的競爭程度等 5 種力量。",a:[["購買者議價能力","購買者的議價能力","消費者議價能力","消費者的議價能力","顧客議價能力","顧客的議價能力","買方議價能力","買方的議價能力"]]},
{y:"111",n:13,q:"若個體對目標具有好惡相間、又愛又恨的矛盾，只想要好的不想要不好的，例如想吃美食又怕體重增加，此為心理/動機衝突中的____衝突。",a:[["趨避","Approach-avoidance"]]},
{y:"111",n:14,q:"根據 Bartlett & Ghoshal 所提出的 4 類多國籍企業中，____企業指的是全球整合度高，地區回應度高，依據各地情況彈性配置資源，兼顧全球整合效率、地區差異化及世界性的開發創新。",a:[["跨國","transnational"]]},
{y:"111",n:15,q:"標竿管理為從競爭者或非競爭者中找出使企業達到優越績效的最佳方法，其中在同一企業內挑選出績效表現最好的部門當作比較與學習的對象，稱為____標竿。",a:[["內部"]]},
{y:"111",n:16,q:"有關賽蒙(Simon)所提出的管理決策三部曲，分別為情報(智慧)活動、____活動及選擇活動。",a:[["設計"]]},
{y:"111",n:17,q:"藉由排除令員工不愉快的事件作為獎勵以塑造員工行為，如上班準時，就不取消全勤獎金，讓員工「準時上班」的行為重複發生機率提高，此為操作制約理論中的____。",a:[["負增強","負向強化","負強化"]]},
{y:"111",n:18,q:"邁爾斯與司諾(Miles and Snow)提出之適應策略，認為企業在不同環境下，應該發展出不同的策略來應付環境的挑戰，其中主動積極開發新市場及新產品，強調透過持續性的創新來維持成長的動力，稱為____型策略。",a:[["探勘","探勘者","前瞻者","前瞻型者","Prospector"]]},
{y:"111",n:19,q:"非正式溝通係指在組織結構外，來自人員自發行動所形成的溝通網路，依據戴維斯(Davis)的分類，資訊由數個中心人物傳達給其他人，稱為____連鎖，此為組織中最常見的非正式溝通。",a:[["群集","集群","群眾","cluster"]]},
{y:"111",n:20,q:"團隊中出現個人在團體中工作時所出的努力比自己單獨工作時更少，此現象稱為____。",a:[["社會賦閒","Social Loafing","社會惰化","社會閒散","社會懈怠","搭便車","搭便車效應","Free-rider","Free rider"]]},
// ===== 110 =====
{y:"110",n:1,q:"企業組織致力於綠化的方法可依「綠化程度」(shapes of green)區分為 4 種途徑，其中____途徑是指組織會對顧客的環境偏好有所回應，顧客對環保產品的任何要求，組織都會盡可能提供。",a:[["市場"]]},
{y:"110",n:2,q:"一般常見的決策偏誤中，決策者依賴初期資訊，將其當作起始點，一旦他們心中有定案後，就無法根據後來的資訊做適當的調整，稱之為____。",a:[["定錨效果","定錨效應","定錨偏差","定錨偏誤","定錨捷思","錨定效果","錨定效應","錨定偏差","錨定偏誤","錨定捷思","定錨","錨定"]]},
{y:"110",n:3,q:"組織設計的流程牽涉到 6 個重要元素的決策，包含專業分工、部門化、指揮鏈、____、集權與分權，以及正式化。",a:[["控制幅度","管理幅度"]]},
{y:"110",n:4,q:"「OGSM 一頁計畫表」為許多知名產業所採用，其包含 4 個項目，分別為最終目的、具體目標、____及檢核。",a:[["策略"]]},
{y:"110",n:5,q:"____理論認為領導者會劃分內、外團體，而內團體的成員將會有較高的績效評估、較低的離職率及較高的工作滿意度。",a:[["領導-成員交換","領導成員交換","領導者與成員交換","LMX"]]},
{y:"110",n:6,q:"麥克里蘭(David McClelland)等人所提出的三需求理論(three-needs theory)，認為 3 種後天的需求是人們工作的動機，分別為____需求、權力需求及歸屬需求。",a:[["成就"]]},
{y:"110",n:7,q:"領導者的權力來源有 5 種，其中____權力是基於專業、特殊技術或知識而來的權力。",a:[["專家"]]},
{y:"110",n:8,q:"____是指對一個人的價值觀念、態度與行為有間接或直接影響的群體，常會影響消費者對產品的購買動機、評估與選擇。",a:[["參考團體","參考群體","參照團體","參照群體"]]},
{y:"110",n:9,q:"當廠商的資源有限，無法在主要市場與其他競爭者抗衡時，可以傾全力爭取一個其他廠商看不上眼、不想進入的次要市場，這種方式稱為____行銷。",a:[["集中","集中化","利基","單一區隔集中化"]]},
{y:"110",n:10,q:"A 公司有流動資產 1,200 萬，存貨 400 萬，流動負債 500 萬，則該公司之速動比率為____。",a:[["1.6","8/5","160%"]]},
{y:"110",n:11,q:"資產負債表的內容由資產、負債和____三大部分所構成，能夠顯示企業在某個時間點的財務狀況。",a:[["股東權益","業主權益","權益"]]},
{y:"110",n:12,q:"波士頓顧問團發展之 BCG 矩陣中，____事業為高市場占有率及低市場成長率。",a:[["金牛"]]},
{y:"110",n:13,q:"SWOT 分析為策略分析的重要工具，協助經理人進行適當的決策，其中 T 代表____。",a:[["威脅","Threat","Threats"]]},
{y:"110",n:14,q:"企業產品生命週期共分為 4 個時期，當進入____期時，產品銷售量急遽攀升，且競爭者數量開始增加。",a:[["成長"]]},
{y:"110",n:15,q:"____性創新之概念，係指產品、服務或流程上的創新，顛覆現有的市場競爭模式與遊戲規則，有利於市場新進者挑戰現有市場在位者。",a:[["破壞"]]},
{y:"110",n:16,q:"彼得聖吉(Peter M. Senge)提出建構「學習型組織」的五項修練，其中____，強調以新思維方式擺脫錯誤的經驗與邏輯，運用整體性的觀點駕馭複雜的外在事物。",a:[["系統思考","系統性思考","系統化思考","系統式思考"]]},
{y:"110",n:17,q:"企業可以透過____管理，降低不可控事件所帶來的威脅或損失，進而減少對企業經營造成不利的影響。",a:[["風險"]]},
{y:"110",n:18,q:"當注入經濟體系的貨幣超過實際產出，導致物價水準持續上漲，稱之為____膨脹。",a:[["通貨"]]},
{y:"110",n:19,q:"整合兩項資源後，產生的總效果大於兩項資源單獨效果的加總(亦即為 1+1>2 的效果)，稱之為____。",a:[["綜效","synergy"]]},
{y:"110",n:20,q:"在波特(M. E. Porter)的競爭策略中，以低價做為主要競爭手段，將重點置於追求生產上的規模經濟，對於研發、生產、行銷等費用有嚴格管控，稱之為____策略。",a:[["成本領導","成本領袖","低成本領導","低成本領袖"]]},
// ===== 109 =====
{y:"109",n:1,q:"根據凱茲(Katz)及派維與羅(Pavett and Lau)的主張，管理者如何能夠在錯綜複雜的情況中抽絲剝繭、理出頭緒，係有賴於管理者的____化能力。",a:[["概念","觀念"]]},
{y:"109",n:2,q:"道德決策標準存在 4 種觀點，其中____主義的觀點著重於行為的結果，而非行為背後的動機，最佳行為是能為最多數人爭取最大利益的行為。",a:[["功利"]]},
{y:"109",n:3,q:"併購是企業常見的一種成長方式，____併購是指併購者與被併購者在產業鏈中處於相同位置，彼此是競爭者，但兩者合併後可以擴大市場或達到規模生產，以發揮一加一大於二的綜效。",a:[["水平","水平式"]]},
{y:"109",n:4,q:"組織圖揭露組織結構的 4 項重要資訊：任務、分工、管理的層級、____。",a:[["指揮鏈"]]},
{y:"109",n:5,q:"工作特性模型(Job Characteristics Model)提出 5 個主要核心構面，分別為技術多樣性、任務完整性、任務重要性、自主性、____。",a:[["回饋","回饋性"]]},
{y:"109",n:6,q:"於企業常選用的訂價策略中，____式訂價是假設消費者對商品價格比較敏感，較低的價格可以刺激營業額，故以較低價來鼓勵消費者嘗試購買和試用，搶佔市場佔有率。",a:[["滲透","市場滲透"]]},
{y:"109",n:7,q:"當組織相當複雜，或組織的產品同時具有很多特性時，採用 2 種以上的部門化方式進行編組的組織，稱為____式組織。",a:[["矩陣","混合"]]},
{y:"109",n:8,q:"通路廣度決策中的____性配銷，是採用最大可能數目的零售商來配銷產品，其優點是能夠提供最大的產品涵蓋面。",a:[["密集"]]},
{y:"109",n:9,q:"直線職權是指賦予管理者指揮部屬工作的職權，而____職權只是輔助直線職權進行管理工作，本身並無直接指揮部屬的職權。",a:[["幕僚"]]},
{y:"109",n:10,q:"企業的社會責任主要存在著 2 種觀點，其中____觀點認為企業的責任遠超過創造利潤，還包含保護及增進社會福祉。",a:[["社會經濟"]]},
{y:"109",n:11,q:"企業將未到期的票據，以預扣利息方式出售給銀行，稱為____。",a:[["貼現","票據貼現"]]},
{y:"109",n:12,q:"在現實世界中，因受到許多因素造成市場無法達到完全競爭的狀態，此種違反柏拉圖效率的現象稱為____。",a:[["市場失靈"]]},
{y:"109",n:13,q:"科學管理學派假定人的思考和行為都是目標理性的，將人視之為____。",a:[["經濟人"]]},
{y:"109",n:14,q:"工作分析之後，用以決定工作人員所應具備最低資格條件之書面說明是____。",a:[["工作規範","工作規範書"]]},
{y:"109",n:15,q:"哈佛大學教授黎特文和史春格(Litwin & Stringer)提出，倡導以「整體與主觀」的環境觀念研究組織成員的行為動機，此種概念稱之為____。",a:[["組織氣候"]]},
{y:"109",n:16,q:"麥可波特(Michael E. Porter)提出企業經營活動的所有環節，從一開始的原物料到送達最終消費者手中的產品，每一個階段都有貢獻，此即所謂的____。",a:[["價值鏈"]]},
{y:"109",n:17,q:"當企業生產規模擴大，企業同時也面臨內部管理複雜度增加及協調困難等問題，造成成本升高的現象，稱之為____。",a:[["規模不經濟"]]},
{y:"109",n:18,q:"員工衡量自己的投入與報酬應維持平衡，且會與他人比較來決定自己的努力程度，此激勵理論稱之為____。",a:[["公平理論","衡平理論"]]},
{y:"109",n:19,q:"A 公司 106 年平均資產總額為 1,350 萬元，平均股東權益為 810 萬元，總資產報酬率為 30 %，A 公司該年度之股東權益報酬率為____%。",a:[["50"]]},
{y:"109",n:20,q:"運用計畫評核術(PERT)從整體完成工作之各路線中，找出一條所需時間最長的路線，稱之為____。",a:[["要徑","主要路徑","關鍵路徑"]]},
// ===== 108 =====
{y:"108",n:1,q:"當代企業管理學者多認為：管理功能係指管理者運用規劃、____、領導及控制等 4 大主要功能，來達成企業所訂定的目標。",a:[["組織"]]},
{y:"108",n:2,q:"當企業編擬策略規劃時，常使用 SWOT 分析所面臨外部環境及本身內部條件，以制定有效的經營策略，其中 O 代表____。",a:[["機會"]]},
{y:"108",n:3,q:"行銷組合 4P 是從生產者的觀點看、4C 是從消費者的觀點看，4P 中的「促銷」對應到 4C 中的____。",a:[["溝通"]]},
{y:"108",n:4,q:"企業產品生命週期分為以下 4 個階段期：導(引)入期、成長期、____期及衰退期。",a:[["成熟"]]},
{y:"108",n:5,q:"在作業管理的工具中，____係源於 1958 年美國海軍的北極星火箭系統計劃，是網絡分析的技術，以網絡圖規劃整個專案將各項作業與主要事件排程聯結。",a:[["計畫評核術","計劃評核術","PERT"]]},
{y:"108",n:6,q:"依照一般學理而言，廣義的財務管理可分為 3 大領域：金融市場、投資學及____，其中最後一項主要涉及公司實際的管理運作所會遇到的財務問題。",a:[["公司理財"]]},
{y:"108",n:7,q:"公司最重要的主要財務報表可分為：資產負債表、綜合損益表、____表及股東權益變動表，作為經營決策及管理的依據。",a:[["現金流量"]]},
{y:"108",n:8,q:"羅伯特‧希斯(Robert Heath)提出之危機管理 4R 模式分為以下 4 個步驟：____力、預備力、反應力及恢復力。",a:[["縮減"]]},
{y:"108",n:9,q:"有關企業功能中，____管理的主要職能包括：人員招募、培訓開發、薪酬福利、績效考核及員工關係等。",a:[["人力資源"]]},
{y:"108",n:10,q:"依一個行業的產業結構不同競爭程度，競爭者的家數由無、少、多、眾多之狀態，可分為以下 4 類市場：____市場、寡占市場、獨占性競爭市場及完全競爭市場。",a:[["獨占","獨佔"]]},
{y:"108",n:11,q:"羅賓斯(Stephen Robbins)根據「思考方式」及「對模糊的容忍程度」2 個構面，將決策風格分為以下 4 種類型：指示型、____型、觀念型及行為型。",a:[["分析"]]},
{y:"108",n:12,q:"企業思考產品組合時主要有 4 個指標，其中____指標係指產品組合內企業所擁有產品項目的數量。",a:[["長度","產品組合長度","產品線長度"]]},
{y:"108",n:13,q:"有關知識管理中，企業員工與團隊能為企業帶來競爭優勢的所有知識與能力的總和，稱之為____資本，包含如：人員作業經驗、生產技術、團隊溝通機制、顧客關係及品牌地位等。",a:[["智慧"]]},
{y:"108",n:14,q:"所謂____是展現組織未來經營雄心及企圖，也是長期努力經營可實現的遠景。例如：台電公司以「成為卓越且值得信賴的世界級電力事業集團」為代表。",a:[["願景"]]},
{y:"108",n:15,q:"組織內的任務分工及工作之間的相互關係，稱之為組織____，如以書面圖示方式加以呈現即為組織圖。",a:[["結構"]]},
{y:"108",n:16,q:"麥肯錫管理顧問公司提出 7S 模型，可用來診斷一家公司的經營績效，該模型分為：結構、____、系統、技能、人員、風格及共享價值等 7 項要素。",a:[["策略"]]},
{y:"108",n:17,q:"所謂____係指一種指導及管理的機制，以落實公司經營者的責任為目的，藉由加強公司績效管理且兼顧其他利害關係人利益，以保障股東權益。",a:[["公司治理"]]},
{y:"108",n:18,q:"某公司之期初存貨為 4 萬元、期末存貨為 2 萬元、銷貨成本為 60 萬元，則該公司存貨週轉率為____。",a:[["20","20次"]]},
{y:"108",n:19,q:"企業常以專利作為保護創新的方式，依我國「專利法」規定，專利種類可分為以下 3 種：____專利、新型專利及設計專利。",a:[["發明"]]},
{y:"108",n:20,q:"依我國「標準法」規定，由標準專責機關依該法規定之程序制定或轉訂，可供公眾使用之標準，稱之為____標準。",a:[["國家","CNS"]]},
// ===== 107-12 =====
{y:"107-12",n:1,q:"在管理的理論中，強調沒有任何放諸四海皆準的法則，意即在變動的環境中，沒有最佳的單一管理方法，稱為____理論。",a:[["權變","情境"]]},
{y:"107-12",n:2,q:"企業協助新進員工儘早適應組織文化，且最後產生高度認同的過程稱為____。",a:[["社會化","Socialization","組織社會化","引導"]]},
{y:"107-12",n:3,q:"工作特性模式(job characteristics model)，主要是讓管理者在進行____時，藉由對五大工作核心的掌握，來正面影響員工的基本心理狀態，達成組織目標。",a:[["工作設計","工作再設計","Job Design"]]},
{y:"107-12",n:4,q:"有關知識管理基本活動之過程依序為：知識吸收、____、____、知識擴散。（每格 1 分）",a:[["知識創造"],["知識累積","知識儲存","store"]]},
{y:"107-12",n:5,q:"Skinner 於 1971 年提出增強理論(reinforcement theory)，認為行為是其結果的函數，行為由外在因素所造成，故透過提供其不想要的事物來阻止某特定行為一再發生，此即____。",a:[["懲罰","處罰","Punishment"]]},
{y:"107-12",n:6,q:"企業為了達成年度的總體經營目標，將公司內部分為數個獨立自負盈虧的營運單位，授予其經營責任，並依其營運結果進行績效衡量及最後績效獎懲，稱為____制度。",a:[["責任中心","事業部","事業部門","事業組織","事業單位"]]},
{y:"107-12",n:7,q:"企業執行全面品質管理(TQM)時，常用的 7 大基本品質工具中，____可提供結構性的方法，有助於解決問題時，釐清可能的問題來源，通常在腦力激盪會議後使用，以整理所產生的構想。",a:[["特性要因圖","魚骨圖","因果圖"]]},
{y:"107-12",n:8,q:"涵蓋企業所有活動的系統，藉由應用模組與資料庫等資訊系統整合包括財務、會計、物流及生產等功能，並能支援經營決策，此即____系統。",a:[["企業資源規劃","ERP"]]},
{y:"107-12",n:9,q:"個人決策理論中，在環境不確定，資訊不完全充分，有時間及成本的壓力下，退而求其次作出差強人意的決定，甚至可能產生承諾升高的情況，稱為____決策。",a:[["有限理性","準理性","受限理性","限度內理性","滿意","有限","Limited","Quasi-rational"]]},
{y:"107-12",n:10,q:"依據「路徑-目標模式」(path-goal model)，House 提出了四種類型的領導行為，其中讓部屬知道領導者對他們的期望，並對如何完成任務明確說明，係屬____型領導者。",a:[["指導","指示","Directive"]]},
{y:"107-12",n:11,q:"策略聯盟(strategic alliances)的型式中，夥伴間為某個目標而新成立的一家獨立公司，以共同分攤風險，集中優勢，稱為____企業。",a:[["合資","Joint Venture"]]},
{y:"107-12",n:12,q:"在決策偏差與錯誤中，當管理者在分析問題時，沒有專注於未來，只惋惜過去花費的時間、金錢或努力，未能接受現在的決策無法改變過去的事實，此類決策錯誤稱為____錯誤。",a:[["沉沒成本","沉澱成本"]]},
{y:"107-12",n:13,q:"甲公司有流動資產$100,000，淨固定資產$500,000，流動負債$70,000，長期借款$200,000，其淨營運資金為$____。",a:[["30000","3萬"]]},
{y:"107-12",n:14,q:"P. N. Romani 等學者將目標管理法(management by objectives, MBO)歸納為四個元素，分別是清楚的目標、____、明確的期限及成果的檢視。",a:[["參與式的決策","參與式決策","決策參與","參與管理","員工參與","部屬參與","成員參與","全員參與","員工要參與決策","共同參與"]]},
{y:"107-12",n:15,q:"現金流量表顯示企業營運活動、投資活動及____活動三方面對現金收支流量的影響。",a:[["融資","籌資","理財"]]},
{y:"107-12",n:16,q:"企業提供員工有利條件，使其取得服務企業的股票成為股東，員工努力的成果可由企業發放股息與股利中分享，亦共同承擔經營成敗風險的獎勵制度稱為____。",a:[["員工入股制","分紅入股制","員工認股權","員工持股計畫","股票選擇權","入股","員工認股計畫"]]},
{y:"107-12",n:17,q:"在整合通路系統中，相同或類似的通路相互合作，例如台電公司與台水公司合作開辦「水電麻吉貼心聯合服務」，相互受理對方用戶過戶等申辦案件，分享通路資源的通路型態稱為____系統。",a:[["水平行銷","Horizontal Marketing System","共棲行銷","共生行銷","Symbiotic Marketing","水平通路整合","Horizontal Channel Integration","水平整合","水平行銷整合"]]},
{y:"107-12",n:18,q:"乙公司股票面額為$20，每股盈餘為$10，股票市價為$100，則其本益比為____。",a:[["10"]]},
{y:"107-12",n:19,q:"因為發訊者表達不夠精確或收訊者誤解所產生的溝通障礙，發訊者可以對收訊者提出一連串問題，或請收訊者重述自己的話以確認理解來克服障礙，此一技巧稱為____。",a:[["回饋","利用回饋","反饋"]]},
{y:"107-12",n:20,q:"資訊管理者應用統計和電子技術來搜尋、篩檢與重組資料群，以發掘實用資訊的過程稱為____。",a:[["資料挖掘","資料採礦","資料探勘","資料挖礦","Data Mining"]]},

{y:"107-05",n:1,q:"企業的 4 大財務報表中，呈現企業在某個時間點財務狀況的報表為____。",a:[["資產負債表","財務狀況表","平衡表"]]},
{y:"107-05",n:2,q:"彼得聖吉(Peter Senge)的《第五項修練》提出有別於傳統組織，能不斷學習、適應及改變的組織稱為____組織。",a:[["學習型"]]},
{y:"107-05",n:3,q:"某公司 106 年之利息保障倍數為 3，利息費用為$10,000，若所得稅率為 25 %，稅後淨利為$____。",a:[["15000","1.5萬"]]},

{y:"107-05",n:5,q:"組織面對的環境中，會受組織決策和行動影響的人或團體，如政府、競爭者、員工、顧客或產業工會等，均稱為____。",a:[["利害關係人"]]},
{y:"107-05",n:6,q:"依據麥克波特(Michael Porter)運用 5 力模式選擇的競爭策略，提供獨特而為顧客喜愛的產品，如蘋果公司(Apple)創新的產品設計，即是採取____策略。",a:[["差異化"]]},
{y:"107-05",n:7,q:"情境領導理論(situational leadership theory, SLT)使用任務與關係行為 2 項領導構面，考慮各構面的高低程度結合出 4 種領導風格，其中認為部屬處於有能力卻不願意去做的階段時，領導者應採取____型領導風格，以獲得部屬支持。",a:[["參與"]]},
{y:"107-05",n:8,q:"預算編列中總結不同單位的收入與支出預算，以計算各單位的利潤貢獻稱為____預算。",a:[["利潤"]]},

{y:"107-05",n:10,q:"組織中有些衝突能支持群體目標並改善群體績效，此類有建設性的衝突稱為____衝突。",a:[["功能性"]]},
{y:"107-05",n:11,q:"某公司流動比率為 3，速動比率為 2。若速動資產為$20,000，則流動資產為$____。",a:[["30000","3萬"]]},
{y:"107-05",n:12,q:"有關 French & Raven 所舉的 5 種權力中，因個人魅力或特質讓部屬心甘情願跟隨的權力稱為____權。",a:[["參照","參考","歸屬"]]},
{y:"107-05",n:13,q:"假設某飲料店每年營運的固定成本是 10 萬元，每瓶飲料變動成本為 10 元，售價為 15 元，須賣出____瓶即可達到損益平衡。",a:[["20000","2萬"]]},
{y:"107-05",n:14,q:"管理是一種持續進行的活動，而管理功能中的「控制」是提供由結果回饋到____之間的必要連結。",a:[["規劃","計劃","計畫"]]},
{y:"107-05",n:15,q:"管理者可在行動開始前、進行中或結束後執行控制，利用走動式管理直接監督是屬於____控制。",a:[["即時","事中","同步","關卡","審查"]]},
{y:"107-05",n:16,q:"在評估員工績效時，利用管理者、員工和同事等回饋作為衡量依據的一種績效評估方法稱之為____評估法。",a:[["360度","360度回饋","360"]]},
{y:"107-05",n:17,q:"明茲伯格(Henry Mintzberg)的 10 種管理者角色，其中傳播者與發言人是屬____角色。",a:[["資訊"]]},
{y:"107-05",n:18,q:"企業為了解員工的人格特質進而預測員工的行為，常用的 MBTI(Myers-Briggs Type Indicator)性格評量測驗中，____型的人顯現適應力強而且容忍度高。",a:[["認知"]]},
{y:"107-05",n:19,q:"依組織溝通的 4 種流向，公司高階管理者每天早上會聚集員工進行 10 分鐘的會議宣布工作安全注意事項及表揚績效優良者，稱為____溝通。",a:[["下行","向下"]]},
{y:"107-05",n:20,q:"管理者從競爭者或非競爭者中找出該企業達到優越績效的最佳作法稱為____管理。",a:[["標竿","Benchmarking"]]},

{y:"106",n:1,q:"企業機能有 5 項分別為：生產管理、行銷管理、人力資源管理、研究發展管理及____管理。",a:[["財務"]]},
{y:"106",n:2,q:"所謂企業____係指企業承諾遵守道德規範，致力於經濟發展的同時，也兼顧改善員工個人及其家庭生活，增進當地社區與社會的生活品質。",a:[["社會責任"]]},
{y:"106",n:3,q:"我國「公司法」規定，公司種類可分為以下 4 種：無限公司、有限公司、兩合公司及____公司經營型態。",a:[["股份有限"]]},
{y:"106",n:4,q:"李文(Lewin)提出的組織變革(遷) 3 步驟，分別為：____、執行變革(遷)及再結凍。",a:[["解凍"]]},
{y:"106",n:5,q:"在企業或組織中人力資源管理的 5 個作業範疇，包含：選才、用才、育才、晉才及____。",a:[["留才"]]},
{y:"106",n:6,q:"所謂____表係揭露企業在某特定期間的收入、成本、費用及獲利狀況的經營成果報表，可看出該企業的獲利能力及經營績效。",a:[["損益","綜合損益"]]},
{y:"106",n:7,q:"克里斯汀生(Christensen)教授提出____式創新，顛覆了原本以「性能」為主的技術創新概念，改以提供新商業模式來擴大和開發新市場，以低價、好用及便利等特色吸引特殊目標消費群。",a:[["破壞"]]},
{y:"106",n:8,q:"所謂顧客____管理係指企業運用現代化資訊科技進行蒐集、處理及分析顧客資料，以找出顧客購買模式及購買群體，並制定有效的行銷策略滿足顧客的需求。",a:[["關係"]]},
{y:"106",n:9,q:"責任中心制度依會計損益及組織權責分 5 種，例如：以貨幣金額投入、產出不易以貨幣金額衡量，且費用須控制在預算內之幕僚單位適用費用中心；如成立策略經營單位(SBU)或實施事業部單位適用____中心。",a:[["利潤"]]},
{y:"106",n:10,q:"實施全面品質管理時，管理大師戴明(Deming)所提出 PDCA 循環，其中 P 代表計畫、D 代表____。",a:[["執行"]]},
{y:"106",n:11,q:"6 個標準差(Six Sigma)所代表的意義換成品質管理的觀點，即每 1 百萬個產出中只容許____個不良。",a:[["3.4"]]},
{y:"106",n:12,q:"預算的類型依作業執行分為 3 類，當企業在訂定未來發展目標時，編制計畫對固定資產進行購置、擴充、改造或更新所需預算，稱之為____預算。",a:[["資本","資本支出"]]},
{y:"106",n:13,q:"波特(Porter)提出產業競爭策略有 3 種，包含：成本領導策略、____策略及集中化策略。",a:[["差異化"]]},
{y:"106",n:14,q:"某公司有流動資產 1,300 萬元，流動負債 400 萬元，存貨 100 萬元，則該公司之速動比率為____。",a:[["3"]]},
{y:"106",n:15,q:"行銷組合係指企業用以滿足目標市場的一組行銷工具，麥肯錫(McCarthy)提出之 4Ps 架構包含：____、價格、通路及推廣。",a:[["產品"]]},
{y:"106",n:16,q:"組織中，一套組織成員共有的價值、信念與象徵的複雜組合，稱之為____，它會影響組織成員的言行。",a:[["組織文化"]]},
{y:"106",n:17,q:"韋伯(Weber)的理想型官僚制度係建構在權威的基礎上，其演進過程為傳統權威、超人權威及____權威。",a:[["合法","法定","法理","合法理性","理性合法","合法合理","理性法定","法定理性"]]},
{y:"106",n:18,q:"所謂____係指一個名稱、符號、標記、設計或是以上綜合的使用，用來確認一個(群)銷售者的產品或服務，以與競爭者有所區別。",a:[["品牌"]]},
{y:"106",n:19,q:"我國「公開發行公司建立內部控制制度處理準則」規定，公開發行公司之內部控制制度，其組成要素應包括：控制環境、____、控制作業、資訊與溝通及監督作業。",a:[["風險評估"]]},
{y:"106",n:20,q:"我國「上市上櫃公司治理實務守則」規定，上市上櫃公司建立公司治理制度除應遵守法令及章程之規定等外，應依「保障股東權益、強化____職能、發揮監察人功能、尊重利害關係人權益及提昇資訊透明度」原則為之。",a:[["董事會"]]},

{y:"105",n:1,q:"由少數幾家廠商生產同質或異質的產品，彼此互相競爭或互相依賴的市場，稱為____市場。",a:[["寡占","寡佔","寡頭壟斷"]]},
{y:"105",n:2,q:"羅伯‧凱茲(Robert L. Katz)所描述的管理能力中，基層管理者最應具備的管理能力為____能力。",a:[["技術","技術性","技能","技能性"]]},

function norm(s){
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/[\s,，、。．.$＄「」『』"'’‘“”:：;；!！?？]/g,"")
    .replace(/[→>＞\-－—~～\/／()（）\[\]]/g,"")
    .replace(/(元|次|天|個|瓶)$/,"");
}
function trimSuffix(s){return s.replace(/(型|式|性|的|者)$/,"");}
function variants(alt){
  const v=new Set();
  const a=norm(alt); v.add(a); v.add(trimSuffix(a));
  const noParen=norm(String(alt).replace(/[（(][^）)]*[）)]/g,"")); v.add(noParen); v.add(trimSuffix(noParen));
  return v;
}
function matchBlank(user,alts){
  const u=norm(user); if(!u) return false;
  const u2=trimSuffix(u);
  return alts.some(alt=>{const v=variants(alt); return v.has(u)||v.has(u2);});
}
function following(q,i){const parts=q.q.split("____");return norm((parts[i+1]||"").slice(0,4));}

  if(matchBlank(user,alts)) return true;
  const u=norm(user);
  for(let L=Math.min(4,fol.length);L>=1;L--){const t=fol.slice(0,L); if(t&&u.length>L&&u.endsWith(t)&&matchBlank(u.slice(0,-L),alts)) return true;}
  return false;
}
function grade(q,answers){
  const fol=q.a.map((_,i)=>following(q,i));
  if(q.unordered&&q.a.length===2){
    const s1=[matchCtx(answers[0],q.a[0],fol[0]),matchCtx(answers[1],q.a[1],fol[1])];
    const s2=[matchCtx(answers[0],q.a[1],fol[0]),matchCtx(answers[1],q.a[0],fol[1])];
    return (s2[0]+s2[1])>(s1[0]+s1[1])?s2:s1;
  }
  return q.a.map((alts,i)=>matchCtx(answers[i]||"",alts,fol[i]));
}

// ---------- 練習流程 ----------
let selYears=new Set(["115"]), mode="seq", onlyNew=false, queue=[], qi=0, inBookMode=false, answered=false;
function buildChips(){
  const box=$("yearChips"); box.innerHTML="";
  const all=document.createElement("button"); all.className="chip"; all.textContent="全選";
  all.setAttribute("aria-pressed",String(selYears.size===YEARS.length));
  all.onclick=()=>{selYears=selYears.size===YEARS.length?new Set():new Set(YEARS);buildChips();};
  box.appendChild(all);
  YEARS.forEach(y=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=yLabel(y);
    b.setAttribute("aria-pressed",String(selYears.has(y)));
    b.onclick=()=>{selYears.has(y)?selYears.delete(y):selYears.add(y);buildChips();};
    box.appendChild(b);
  });
  updatePoolInfo();
}
function pool(){
  return FILL.filter(q=>selYears.has(q.y)&&(!onlyNew||!(state.fill[key(q)]&&(state.fill[key(q)].c+state.fill[key(q)].w))));
}
function updatePoolInfo(){$("poolInfo").textContent="將出 "+pool().length+" 題";$("startBtn").disabled=pool().length===0;if(!inBookMode)setupSummary();}
function setMode(m){mode=m;setupSummary();$("mSeq").setAttribute("aria-pressed",String(m==="seq"));$("mRand").setAttribute("aria-pressed",String(m==="rand"));}
$("mSeq").onclick=()=>setMode("seq");
$("mRand").onclick=()=>setMode("rand");
$("mNew").onclick=()=>{onlyNew=!onlyNew;$("mNew").setAttribute("aria-pressed",String(onlyNew));updatePoolInfo();};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setupSummary(){
  const ys=selYears.size===YEARS.length?"全部年度":selYears.size===0?"未選年度":selYears.size<=3?[...selYears].map(yLabel).join("、"):selYears.size+" 個年度";
  $("setupSum").textContent=ys+"・"+(mode==="rand"?"隨機":"依題號")+(onlyNew?"・只出沒練過的":"");
}
$("startBtn").onclick=()=>{
  queue=pool().map(key); if(mode==="rand") shuffle(queue);
  inBookMode=false; $("setup").open=false; setupSummary(); startRound();
  window.scrollTo({top:0,behavior:"auto"});
};
function startBook(){
  const ks=Object.keys(state.fill).filter(k=>state.fill[k].book&&byKey[k]);
  if(!ks.length){toast("錯題本目前是空的");return;}
  queue=shuffle(ks); inBookMode=true; $("setup").open=false; $("setupSum").textContent="錯題本・隨機"; switchView("practice"); startRound();
}
$("bookPractice").onclick=startBook;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let sess=[];  // 本輪每題的作答紀錄，供上一題／下一題回看
function startRound(){sess=[];qi=0;showQ();}
function showQ(){
  const card=$("qcard"); card.hidden=false;
  if(qi>=queue.length){
    $("setup").open=true;
    const done=sess.filter(Boolean).length, ok=sess.filter(x=>x&&x.allOk).length;
    card.innerHTML='<h2>這一輪練完了</h2><p class="sub">共 '+queue.length+' 題，作答 '+done+' 題，答對 '+ok+' 題。答錯的題目已收進錯題本。</p><div class="row"><button class="btn ghost" id="backLast">回到最後一題</button><button class="btn" id="againBtn">再練一輪</button><button class="btn ghost" id="toBook">看錯題本</button></div>';
    $("backLast").onclick=()=>{qi=queue.length-1;$("setup").open=false;showQ();};
    $("againBtn").onclick=()=>{if(mode==="rand"||inBookMode)shuffle(queue);$("setup").open=false;startRound();};
    $("toBook").onclick=()=>switchView("book");
    return;
  }
  const q=byKey[queue[qi]], r=state.fill[key(q)], s0=sess[qi];
  let idx=0;
  const html=esc(q.q).replace(/____/g,()=>{const i=idx++;return '<input class="blank" id="b'+i+'" autocomplete="off" aria-label="第 '+(i+1)+' 格">';});
  const hist=r&&(r.c+r.w)?'<span class="meta">紀錄：對 '+r.c+'／錯 '+r.w+'</span>':'';
  card.innerHTML='<div class="qhead"><div class="row"><span class="badge'+(inBookMode?' bad':'')+'">'+(inBookMode?'錯題・':'')+yLabel(q.y)+' 第 '+q.n+' 題</span>'+hist+'</div><span class="progress">'+(qi+1)+' / '+queue.length+'</span></div>'+
    '<div class="qtext">'+html+'</div>'+
    '<div class="row" id="actRow"><button class="btn" id="checkBtn">送出答案</button><button class="btn ghost" id="skipBtn">不會，看答案</button></div>'+
    '<div id="fb"></div>'+
    '<div class="row navrow"><button class="btn ghost" id="prevBtn">← 上一題</button><button class="btn ghost" id="nextBtn">下一題 →</button></div>';
  const inputs=[...card.querySelectorAll(".blank")];
  $("prevBtn").disabled=qi===0;
  $("prevBtn").onclick=prev; $("nextBtn").onclick=next;
  if(s0){
    inputs.forEach((inp,i)=>{inp.value=s0.vals[i]||"";});
    renderFeedback(q,s0,inputs);
  }else{
    inputs.forEach((inp,i)=>inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){e.preventDefault(); if(sess[qi]){next();} else if(i<inputs.length-1&&!inputs[i+1].value){inputs[i+1].focus();} else check(false);}
    }));
    if(inputs[0]) inputs[0].focus({preventScroll:true});
    $("checkBtn").onclick=()=>check(false);
    $("skipBtn").onclick=()=>check(true);
  }
}
function fmtAns(q){
  return q.a.map((alts,i)=>(q.a.length>1?'第 '+(i+1)+' 格：':'')+'<em>'+esc(alts[0])+'</em>'+(alts.length>1?'（也可：'+esc(alts.slice(1).join("、"))+'）':'')).join('<br>')+(q.unordered?'<br><span class="hint">兩格順序可對調</span>':'');
}
function check(giveUp){
  if(sess[qi]) return;
  const q=byKey[queue[qi]], k=key(q), r=rec(k);
  const inputs=[...document.querySelectorAll("#qcard .blank")];
  const vals=inputs.map(i=>i.value.trim());
  const res=giveUp?q.a.map(()=>false):grade(q,vals);
  const allOk=res.every(Boolean);
  r.last=vals.join("／");
  const before={book:r.book,streak:r.streak||0};
  applyResult(r,allOk);
  sess[qi]={vals,res,allOk,giveUp,before,overridden:false};
  renderFeedback(q,sess[qi],inputs);
  $("nextBtn").focus({preventScroll:true});
  persist(); renderStats(); renderBook();
}
function renderFeedback(q,s1,inputs){
  const r=rec(key(q));
  inputs.forEach((inp,i)=>{inp.classList.remove("ok","bad");inp.classList.add(s1.res[i]?"ok":"bad");inp.readOnly=true;});
  $("actRow").hidden=true;
  const verdict=s1.overridden?'已改判為答對':s1.allOk?'答對了':(s1.giveUp?'官方答案（已收進錯題本）':'答錯了，已收進錯題本');
  $("fb").innerHTML='<div class="feedback '+(s1.allOk?'ok':'bad')+'"><span class="verdict">'+verdict+'</span><div class="ans">'+fmtAns(q)+'</div>'+
    (inBookMode&&s1.allOk?'<span class="hint">'+(r.book?'再答對 1 次就會移出錯題本':'連續答對 2 次，已移出錯題本')+'</span>':'')+
    '</div>'+(!s1.allOk&&!s1.giveUp?'<div class="row"><button class="btn ghost small" id="overrideBtn">我的答案意思相同，算我對</button></div>':'');
  const ob=$("overrideBtn"); if(ob) ob.onclick=()=>{
    r.w=Math.max(0,r.w-1); r.c++; r.streak=s1.before.streak+1; r.book=s1.before.book; if(inBookMode&&r.streak>=2) r.book=false;
    s1.allOk=true; s1.overridden=true; s1.res=s1.res.map(()=>true);
    persist(); renderStats(); renderBook(); renderFeedback(q,s1,inputs);
  };
  const nb=$("nextBtn"); nb.className="btn"; nb.textContent=qi===queue.length-1?"完成本輪 →":"下一題 →（Enter）";
}
function applyResult(r,ok){
  if(ok){r.c++; r.streak=(r.streak||0)+1; if(inBookMode&&r.streak>=2) r.book=false;}
  else{r.w++; r.streak=0; r.book=true;}
}
function next(){qi++;showQ();window.scrollTo({top:$("qcard").offsetTop-12,behavior:"auto"});}
function prev(){if(qi>0){qi--;showQ();window.scrollTo({top:$("qcard").offsetTop-12,behavior:"auto"});}}
document.addEventListener("keydown",e=>{
  if($("view-practice").hidden||$("qcard").hidden) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="Enter"&&sess[qi]){e.preventDefault();next();}
});

// ---------- 依年度收合 ----------
const openGroups={book:new Set(),essay:new Set()};
function groupWrap(kind,y,summaryHtml,bodyHtml){
  return '<details class="fold ygroup" data-kind="'+kind+'" data-y="'+y+'"'+(openGroups[kind].has(y)?' open':'')+'><summary><span><b>'+yLabel(y)+'</b>　'+summaryHtml+'</span></summary><div class="foldbody list">'+bodyHtml+'</div></details>';
}
function bindGroups(box){
  box.querySelectorAll("details.ygroup").forEach(d=>d.addEventListener("toggle",()=>{const set=openGroups[d.dataset.kind]; d.open?set.add(d.dataset.y):set.delete(d.dataset.y);}));
}

// ---------- 錯題本 ----------
function renderBook(){
  const ks=Object.keys(state.fill).filter(k=>state.fill[k].book&&byKey[k]);
  const box=$("bookList");
  if(!ks.length){box.innerHTML='<div class="card empty">目前沒有錯題。去「填充練習」做幾題吧！</div>';return;}
  box.innerHTML=YEARS.map(y=>{
    const items=ks.filter(k=>byKey[k].y===y).sort((a,b)=>byKey[a].n-byKey[b].n);
    if(!items.length) return "";
    const body=items.map(k=>{const q=byKey[k],r=state.fill[k];
      return '<div class="item"><div class="qhead"><span class="badge bad">第 '+q.n+' 題</span><span class="meta">錯 '+r.w+' 次・對 '+r.c+' 次</span></div>'+
      '<div>'+esc(q.q).replace(/____/g,'＿＿＿')+'</div>'+
      (r.last?'<div class="meta">我上次寫：'+esc(r.last)+'</div>':'')+
      '<div class="ans">'+fmtAns(q)+'</div>'+
      '<div class="row"><button class="btn ghost small" data-rm="'+k+'">已熟記，移出錯題本</button></div></div>';}).join("");
    return groupWrap("book",y,'<span class="badge bad">'+items.length+' 題</span>',body);
  }).join("");
  bindGroups(box);
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{state.fill[b.dataset.rm].book=false;persist();renderBook();renderStats();toast("已移出錯題本");});
}
$("bookCopy").onclick=async()=>{
  const ks=Object.keys(state.fill).filter(k=>state.fill[k].book&&byKey[k]);
  if(!ks.length){toast("錯題本目前是空的");return;}
  const txt=ks.map(k=>{const q=byKey[k];return yLabel(q.y)+" 第"+q.n+"題\n"+q.q+"\n答案："+q.a.map(a=>a[0]).join("；")+"\n";}).join("\n");
  try{await navigator.clipboard.writeText(txt);toast("已複製 "+ks.length+" 題，可貼到筆記");}catch(e){toast("這個環境不允許複製，請改用長按選取文字");}
};

// ---------- 問答題 ----------
let eYears=new Set(YEARS), eFilter="all";
function erec(k){return state.essay[k]||(state.essay[k]={rate:"",note:""});}
function buildEssayChips(){
  const box=$("essayYears"); box.innerHTML="";
  YEARS.forEach(y=>{const b=document.createElement("button");b.className="chip";b.textContent=yLabel(y);
    b.setAttribute("aria-pressed",String(eYears.has(y)));
    b.onclick=()=>{eYears.has(y)?eYears.delete(y):eYears.add(y);buildEssayChips();renderEssay();};box.appendChild(b);});
}
document.querySelectorAll("[data-ef]").forEach(b=>b.onclick=()=>{eFilter=b.dataset.ef;document.querySelectorAll("[data-ef]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderEssay();});
function renderEssay(){
  const pass=e=>{const r=state.essay[e.y+"-"+e.n]; if(eFilter==="todo") return !(r&&r.rate); if(eFilter==="bad") return r&&(r.rate==="bad"||r.rate==="mid"); return true;};
  const box=$("essayList");
  const html=YEARS.filter(y=>eYears.has(y)).map(y=>{
    const all=ESSAY.filter(e=>e.y===y), list=all.filter(pass);
    if(!list.length) return "";
    const good=all.filter(e=>(state.essay[e.y+"-"+e.n]||{}).rate==="good").length;
    const body=list.map(e=>{const k=e.y+"-"+e.n, r=state.essay[k]||{};
      return '<div class="item essay" data-rate="'+(r.rate||"")+'" data-k="'+k+'"><div class="qhead"><span class="badge">問答第 '+e.n+' 題・'+e.pts+' 分</span></div>'+
      '<div>'+esc(e.q)+'</div>'+(e.sub?'<ol class="subq">'+e.sub.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ol>':'')+
      '<div class="rate" role="group" aria-label="熟練度">'+[["good","會了"],["mid","不熟"],["bad","不會"]].map(([v,t])=>'<button class="chip" data-v="'+v+'" aria-pressed="'+(r.rate===v)+'">'+t+'</button>').join("")+'</div>'+
      '<label class="meta" for="n-'+k+'">我的答題要點</label><textarea id="n-'+k+'" placeholder="例如：列出 3 個構面＋各一句說明＋舉例">'+esc(r.note||"")+'</textarea></div>';}).join("");
    return groupWrap("essay",y,'<span class="meta">已會 <span data-good="'+y+'">'+good+'</span> / '+all.length+' 題</span>',body);
  }).join("");
  box.innerHTML=html||'<div class="card empty">沒有符合條件的題目</div>';
  bindGroups(box);
  box.querySelectorAll(".item.essay").forEach(el=>{
    const k=el.dataset.k, y=k.slice(0,k.lastIndexOf("-"));
    el.querySelectorAll(".rate .chip").forEach(c=>c.onclick=()=>{const r=erec(k); r.rate=r.rate===c.dataset.v?"":c.dataset.v; persist(); el.dataset.rate=r.rate; el.querySelectorAll(".rate .chip").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===r.rate)));
      const g=box.querySelector('[data-good="'+y+'"]'); if(g) g.textContent=ESSAY.filter(e=>e.y===y&&(state.essay[e.y+"-"+e.n]||{}).rate==="good").length; renderStats();});
    const ta=el.querySelector("textarea"); let t; ta.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{erec(k).note=ta.value;persist();},600);};
  });
}

// ---------- 共用 ----------
function renderStats(){
  const recs=Object.values(state.fill); let done=0,c=0,w=0,book=0;
  recs.forEach(r=>{if(r.c+r.w>0)done++; c+=r.c; w+=r.w; if(r.book)book++;});
  $("sDone").textContent=done; $("sAcc").textContent=(c+w)?Math.round(c/(c+w)*100)+"%":"—"; $("sBook").textContent=book;
  $("sumDone").textContent=done; $("sumAcc").textContent=$("sAcc").textContent; $("sumBook").textContent=book;
  $("sEssay").textContent=Object.values(state.essay).filter(r=>r.rate==="good").length+" / "+ESSAY.length;
  updatePoolInfo();
}
function switchView(v){
  ["practice","book","essay"].forEach(x=>{$("view-"+x).hidden=x!==v;$("tab-"+x).setAttribute("aria-selected",String(x===v));});
  if(v==="book") renderBook(); if(v==="essay") renderEssay();
  try{history.replaceState(null,"","#"+v);}catch(e){}
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchView(t.dataset.view));
let toastT; function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}
function renderAll(){renderStats();renderBook();renderEssay();}

buildChips(); buildEssayChips(); renderAll();
const h=(location.hash||"").slice(1); if(["book","essay"].includes(h)) switchView(h);
// 開啟時直接顯示第一題（最新年度），讓頁面一打開就能作答
queue=FILL.filter(q=>q.y==="115").map(key); startRound();
initCloud();
})();
</script>
