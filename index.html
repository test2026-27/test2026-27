<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>台電備考日誌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 簡化版：首頁只有「今天要做什麼」＋四個大入口，其餘內容各自一頁。日系繪本風、單一淺色。 */
:root {
  --paper: #FFFCF6; --ink: #3E3A39;
  --coral: #F2A497; --yolk: #F6D27A; --sky: #A8D3E6; --leaf: #B9DAA5;
  --coral-t: #FCE4DE; --yolk-t: #FCF1CF; --sky-t: #E4F2F8; --leaf-t: #EAF4E2; --beige: #F1E9DA; --white: #FFFFFF;
  --mute: #6E6560; --r: 26px;
  --f: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.75; font-weight: 400; font-synthesis: none; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; font-weight: 400; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.wrap { max-width: 720px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { position: relative; background: var(--white); border: 3px solid var(--ink); border-radius: var(--r); padding: 22px; min-width: 0; }
.mk { box-shadow: inset 0 -0.5em 0 var(--coral); padding: 0 .12em; }

/* 頂欄 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 3px solid var(--ink); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 9px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 18px; text-decoration: none; white-space: nowrap; }
.brand svg { width: 32px; height: 32px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.4; padding: 2px 12px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 99px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mute); border: 2px solid var(--ink); flex: none; }
.sync[data-s="live"] .dot { background: var(--leaf); }
.sync[data-s="local"] .dot, .sync[data-s="slow"] .dot { background: var(--yolk); }
.sync[data-s="ro"] .dot { background: var(--sky); }

main .wrap { padding-block: 22px 8px; }
.view[hidden] { display: none; }
.pill-link { display: inline-block; padding: 3px 16px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--white); text-decoration: none; font-size: 15px; line-height: 1.6; }
.pill-link:hover { background: var(--yolk-t); }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.page-title { font-size: 26px; line-height: 1.3; }
.sub-note { color: var(--mute); font-size: 14.5px; }
.tag { display: inline-block; font-size: 13px; line-height: 1.5; padding: 0 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--c, var(--white)); white-space: nowrap; }
.s-zh { --c: var(--coral); } .s-en { --c: var(--sky); } .s-bm { --c: var(--yolk); } .s-pa { --c: var(--leaf); } .s-law, .s-misc { --c: var(--beige); }

/* 首頁 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
h1 { font-size: clamp(30px, 7vw, 40px); line-height: 1.3; }
.status { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; }
.status b { font-weight: 400; font-size: 24px; }
.mini-bat { display: inline-flex; align-items: center; }
.mini-bat .cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 90px; padding: 3px; border: 2.5px solid var(--ink); border-radius: 9px; background: var(--white); }
.mini-bat .cells i { height: 12px; border-radius: 3px; background: var(--beige); }
.mini-bat .cells i.on { background: var(--coral); }
.mini-bat .nub { width: 5px; height: 10px; border: 2.5px solid var(--ink); border-left: 0; border-radius: 0 4px 4px 0; background: var(--white); }
.scene { display: block; width: 190px; max-width: 38%; height: auto; flex: none; }

.today { padding: 24px 22px; }
.today .lab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--mute); }
.today .lab b { font-weight: 400; color: var(--ink); font-size: 22px; }
.today .task { margin: 14px 0 20px; font-size: 24px; line-height: 1.6; text-wrap: pretty; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; padding: 8px 24px; border: 3px solid var(--ink); border-radius: 99px; background: var(--coral); font-size: 20px; }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn[aria-pressed="true"] { background: var(--leaf); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.today .sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.switch { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 2px 16px 2px 10px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--white); font-size: 14.5px; }
.switch svg { width: 30px; height: 22px; flex: none; }
.switch[aria-pressed="true"] { background: var(--sky); }
.link { font-size: 14.5px; }
.light-note { margin-top: 12px; padding: 8px 14px; border: 2.5px dashed var(--ink); border-radius: 16px; background: var(--sky-t); font-size: 14px; }
.stamp { position: absolute; right: 16px; top: -28px; width: 88px; height: 88px; transform: rotate(-10deg); pointer-events: none; }
.streak { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; color: var(--mute); }
.pips { display: flex; gap: 5px; }
.pip { width: 16px; height: 16px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); }
.pip.on { background: var(--yolk); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--c); text-decoration: none; min-width: 0; }
.tile:hover { transform: translateY(-2px); }
.tile .ti { width: 46px; height: 46px; border: 3px solid var(--ink); border-radius: 50%; background: var(--white); display: grid; place-items: center; }
.tile .ti svg { width: 28px; height: 28px; }
.tile b { font-weight: 400; font-size: 20px; line-height: 1.3; margin-top: 6px; }
.tile small { font-size: 13.5px; line-height: 1.5; opacity: .85; }
.t1 { --c: var(--yolk-t); } .t2 { --c: var(--coral-t); } .t3 { --c: var(--sky-t); } .t4 { --c: var(--leaf-t); }

/* 本週行程 */
.wk { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.wk .arrow { width: 44px; height: 44px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); font-size: 20px; line-height: 1; }
.wk .arrow:disabled { opacity: .35; cursor: not-allowed; }
.wk .mid { text-align: center; }
.wk .mid b { display: block; font-weight: 400; font-size: 20px; }
.list { margin-top: 16px; padding: 6px 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-top: 2.5px solid var(--paper); }
.row + .row { border-top: 2.5px dashed var(--beige); }
.row:first-child { border-top: 0; }
.row.today { background: var(--yolk-t); }
.row.rest { cursor: default; color: var(--mute); }
.rd { flex: none; width: 52px; font-size: 20px; line-height: 1.2; }
.rd small { display: block; font-size: 12.5px; color: var(--mute); }
.rb { flex: 1; min-width: 0; font-size: 15px; line-height: 1.6; }
.rb .tag { margin-bottom: 2px; }
.rb span.t { display: block; }
.check { flex: none; width: 44px; height: 44px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); font-size: 22px; line-height: 1; }
.check[aria-pressed="true"] { background: var(--leaf); }
.check:disabled { opacity: .4; cursor: not-allowed; }
.bonus { margin-top: 14px; padding: 10px 16px; border: 2.5px dashed var(--ink); border-radius: 18px; background: var(--yolk-t); font-size: 14.5px; }

/* 課程進度 */
.subj { padding: 0; margin-bottom: 14px; overflow: hidden; }
.subj > button { display: block; width: 100%; padding: 16px 20px; border: 0; background: transparent; text-align: left; }
.subj .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.subj .hd b { font-weight: 400; font-size: 20px; }
.subj .hd span { font-size: 18px; }
.meter { height: 16px; margin-top: 10px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); border-right: 2.5px solid var(--ink); border-radius: 0 99px 99px 0; transition: width .4s ease; }
.meter i.z { border-right: 0; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; justify-items: center; padding: 4px 20px 20px; }
.lect { width: 44px; height: 44px; padding: 0; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); font-size: 15px; }
.lect[aria-pressed="true"] { background: var(--c); }
.lect:disabled { cursor: not-allowed; opacity: .75; }

/* 小鳥 */
.bird-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
.bird { text-align: center; padding: 12px 6px; border: 2.5px solid var(--ink); border-radius: 20px; background: var(--sky-t); }
.bird svg { width: 70px; height: 60px; }
.bird.lock { background: var(--beige); border-style: dashed; }
.bird small { display: block; color: var(--mute); font-size: 12.5px; }

/* 單日頁 */
.dp-date { font-size: clamp(54px, 15vw, 80px); line-height: 1.1; }
.dp-week { margin-top: 2px; color: var(--mute); font-size: 14.5px; }
.dp-steps { display: grid; gap: 12px; margin: 18px 0; counter-reset: s; }
.dp-steps li { counter-increment: s; position: relative; padding: 12px 16px 12px 58px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--paper); font-size: 18px; line-height: 1.7; }
.dp-steps li::before { content: counter(s); position: absolute; left: 14px; top: 12px; width: 32px; height: 32px; display: grid; place-items: center; font-size: 18px; background: var(--yolk); border: 2.5px solid var(--ink); border-radius: 50%; }
.dp-pn { display: flex; gap: 8px; }
.m-date { display: flex; align-items: baseline; gap: 12px; }

/* 說明頁 */
.sec { margin-top: 26px; }
.sec h2 { font-size: 21px; margin-bottom: 10px; }
.stops { display: grid; gap: 12px; }
.stop { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 3px solid var(--ink); border-radius: 22px; background: var(--white); }
.stop.now { background: var(--yolk-t); }
.stop .pi { flex: none; width: 46px; height: 46px; border: 3px solid var(--ink); border-radius: 50%; background: var(--c); display: grid; place-items: center; }
.stop .pi svg { width: 28px; height: 28px; }
.stop b { font-weight: 400; font-size: 18px; }
.stop .d { color: var(--mute); font-size: 13px; margin-left: 6px; }
.stop p { font-size: 14.5px; margin-top: 2px; }
.facts, .tips { display: grid; gap: 12px; }
.facts li, .tips li { padding: 12px 16px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--white); font-size: 15px; }
.facts b { display: block; font-weight: 400; font-size: 16.5px; }
.facts span { color: var(--mute); font-size: 14px; }
.split { display: flex; height: 38px; border: 3px solid var(--ink); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.split span { display: flex; align-items: center; padding-left: 16px; font-size: 15px; white-space: nowrap; overflow: hidden; }
.split .w { background: var(--coral); border-right: 3px solid var(--ink); } .split .o { background: var(--yolk); }
.steps { display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 10px 16px 10px 56px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--white); font-size: 15px; }
.steps li::before { content: counter(s); position: absolute; left: 14px; top: 10px; width: 30px; height: 30px; display: grid; place-items: center; font-size: 16px; background: var(--yolk); border: 2.5px solid var(--ink); border-radius: 50%; }
.steps b { display: block; font-weight: 400; font-size: 16.5px; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vs > div { padding: 12px 14px; border: 2.5px solid var(--ink); border-radius: 18px; font-size: 14.5px; }
.vs b { display: block; font-weight: 400; font-size: 16px; margin-bottom: 4px; }
.vs .a { background: var(--leaf-t); } .vs .b { background: var(--yolk-t); }
.tips li { list-style: none; font-size: 14.5px; }

footer { margin-top: 34px; color: var(--mute); font-size: 13.5px; }
footer .wrap { padding-block: 14px 34px; }
.hills { display: block; width: 100%; height: 64px; }
.feed { position: fixed; z-index: 40; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.feed div { background: var(--yolk); border: 3px solid var(--ink); border-radius: 99px; padding: 6px 18px; font-size: 14.5px; max-width: min(92vw, 360px); animation: pop .25s ease-out; }
.feed div.err { background: var(--coral); }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } }

@media (max-width: 520px) {
  .scene { display: none; }
  .today .task { font-size: 22px; }
  .vs { grid-template-columns: minmax(0, 1fr); }
  .bird-grid { grid-template-columns: repeat(2, 1fr); }
  .stamp { width: 76px; height: 76px; top: -30px; }
}
</style>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#home"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#i-bulb"/></svg><span>台電備考日誌</span></a>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="chip">還有 <span id="tb-days">--</span> 天</span>
      <span class="chip sync" id="sync" data-s="wait"><i class="dot"></i><span id="sync-t">連線中</span></span>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="view" id="v-home">
      <div class="top">
        <div>
          <h1>台電雇員<br><span class="mk">備考日誌</span></h1>

    var lab = '<div class="lab"><b>' + md(t) + '</b><span>週' + WD[t.getDay()] + '</span>';
    if (wd && wd.item) {
      var key = dkey(t), done = dayDone(key), ro = readOnly();
      out = '<div class="card today">' + lab + subTag(wd.item[0]) + '</div>' +
        (S.light ? '<p class="light-note">' + LIGHT_NOTE + '</p>' : '') +
        '<p class="task">' + taskText(wd.item) + '</p>' +
        '<button class="btn" data-day="' + key + '" data-label="' + md(t) + '" aria-pressed="' + done + '"' + (ro ? ' disabled' : '') + '>' + (done ? '✔ 今天完成了' : '完成了！') + '</button>' +
        '<div class="sub">' + lightSwitch() + '<a class="link" href="' + dayHref(t) + '">詳細 ›</a></div>' + streakHtml() +
        (done ? '<svg class="stamp" viewBox="0 0 100 100" role="img" aria-label="花丸：今日完成"><use href="#hanamaru"/></svg>' : '') + '</div>';
    } else if (wd) {
      out = '<div class="card today">' + lab + '</div><p class="task">今天休息。好好恢復也是任務。</p>' + streakHtml() + '</div>';
    } else if (diffDays(t, START) < 0) {
      var f = WEEKS[0].days[0];
      out = '<div class="card today"><div class="lab"><span>準備出發</span></div><p class="task">11/9（週一）開始。今天先把阿摩下載好，試做幾題熟悉介面。</p>' +
        '<div class="sub"><span class="sub-note">第一天：' + f[0] + '</span><a class="link" href="' + dayHref(START) + '">看第一天 ›</a></div></div>';
    } else {
      out = '<div class="card today"><p class="task">階段 A 的行程已結束。階段 B 的詳細任務之後補上。</p></div>';
    }
    $('mission-body').innerHTML = out;

    var wk = WEEKS[S.week === null ? Math.max(0, Math.min(WEEKS.length - 1, (weekDay(t) || { wi: 0 }).wi)) : S.week], n = 0, tot = 0, wi = WEEKS.indexOf(wk);
    wk.days.forEach(function (it, di) { if (it) { tot++; if (dayDone(dkey(addDays(START, wi * 7 + di)))) n++; } });
    var cur = currentPhase();
    $('tiles').innerHTML =
      '<a class="tile t1" href="#week"><span class="ti">' + use('i-cal', '0 0 40 40') + '</span><b>本週行程</b><small>第 ' + (wi + 1) + ' 週　完成 ' + n + ' / ' + tot + '</small></a>' +
      '<a class="tile t2" href="#progress"><span class="ti">' + use('i-bag', '0 0 40 40') + '</span><b>課程進度</b><small>已上 ' + c.done + ' / ' + TOTAL + ' 堂</small></a>' +
      '<a class="tile t3" href="#birds"><span class="ti">' + use('bird', '0 0 44 38') + '</span><b>小鳥收藏</b><small>已領 ' + prog().birds + ' / ' + BIRDS.length + ' 隻</small></a>' +
      '<a class="tile t4" href="#guide"><span class="ti">' + use('i-map', '0 0 40 40') + '</span><b>路線與說明</b><small>' + (cur < 0 ? '準備出發' : '目前：' + PHASES[cur].n) + '</small></a>';
  }

  /* ---------- 本週行程 ---------- */
  function renderWeek() {
    if (S.week === null) { var w0 = weekDay(S.today); S.week = w0 ? w0.wi : 0; }
    var w = WEEKS[S.week], ro = readOnly(), html = backHead('本週行程') +
      '<div class="wk"><button class="arrow" data-wk="-1" aria-label="上一週"' + (S.week === 0 ? ' disabled' : '') + '>‹</button><div class="mid"><b>' + w.label.replace(/^第\d+週\s*/, '第 ' + (S.week + 1) + ' 週　') + '</b><span class="sub-note">' + w.sub + '</span></div><button class="arrow" data-wk="1" aria-label="下一週"' + (S.week === WEEKS.length - 1 ? ' disabled' : '') + '>›</button></div>' +
      (S.light ? '<p class="light-note">' + LIGHT_NOTE + '</p>' : '') + '<div class="card list">';
    w.days.forEach(function (it, di) {
      var d = addDays(START, S.week * 7 + di), key = dkey(d), isToday = diffDays(d, S.today) === 0, future = diffDays(d, S.today) > 0, done = dayDone(key);
      var rd = '<span class="rd">' + md(d) + '<small>週' + WD[d.getDay()] + (isToday ? '．今天' : '') + '</small></span>';
      if (!it) { html += '<div class="row rest">' + rd + '<span class="rb">休息日</span></div>'; return; }
      html += '<div class="row' + (isToday ? ' today' : '') + '" data-href="' + dayHref(d).slice(1) + '">' + rd + '<span class="rb">' + subTag(it[0]) + '<span class="t">' + taskText(it) + '</span></span>' +
        '<button class="check" data-day="' + key + '" data-label="' + md(d) + '" aria-pressed="' + done + '" aria-label="' + md(d) + ' 標記完成"' + (ro || future ? ' disabled' : '') + '>' + (done ? '✔' : '') + '</button></div>';
    });
    html += '</div>' + (S.light ? '' : '<p class="bonus">' + w.bonus + '</p>');
    $('v-week').innerHTML = html;
  }

  /* ---------- 課程進度 ---------- */
  function renderProgress() {
    var c = counts(), ro = readOnly(), html = backHead('課程進度') + '<p class="sub-note" style="margin-bottom:14px">上完一堂就點一下數字圓圈。已上 ' + c.done + ' / ' + TOTAL + ' 堂。</p>';
    SUBJECTS.forEach(function (s) {
      var n = c.per[s.k], open = S.openSub === s.k, chips = '';
      if (open) {
        chips = '<div class="chips">';
        for (var i = 1; i <= s.total; i++) { var k = s.k + '_' + i; chips += '<button class="lect" data-lect="' + k + '" aria-pressed="' + lectDone(k) + '" aria-label="' + s.n + '第' + i + '堂"' + (ro ? ' disabled' : '') + '>' + i + '</button>'; }
        chips += '</div>';
      }
      html += '<div class="card subj ' + s.cls + '" style="--c:var(--c)"><button data-sub="' + s.k + '" aria-expanded="' + open + '"><div class="hd"><b>' + s.n + '</b><span>' + n + ' / ' + s.total + (open ? ' ▴' : ' ▾') + '</span></div>' +
        '<div class="meter"><i class="' + (n === 0 ? 'z' : '') + '" style="width:' + (n / s.total * 100) + '%"></i></div></button>' + chips + '</div>';
    });
    $('v-progress').innerHTML = html;
  }

  /* ---------- 小鳥 ---------- */
  function renderBirds() {
    var p = prog(), cap = Math.floor(taskDays().length / 7);
    var html = backHead('小鳥收藏') + '<div class="card"><p>連續完成每天的任務（休息日不算中斷），集滿 7 天就領一隻新小鳥。中斷後連續天數歸零，已領到的小鳥會留著。</p>' + streakHtml() +
      '<p class="sub-note" style="margin-top:10px">階段 A 共 ' + taskDays().length + ' 個任務日，最多領 ' + cap + ' 隻；後面階段的任務表補上後可繼續集。</p></div><div class="bird-grid">';
    BIRDS.forEach(function (b, i) { var got = i < p.birds; html += '<div class="bird' + (got ? '' : ' lock') + '">' + birdSvg(i, got) + '<div>' + (got ? b.n : '？？？') + '</div><small>' + (got ? '第 ' + (i + 1) + ' 隻' : '集滿 7 天領取') + '</small></div>'; });
    $('v-birds').innerHTML = html + '</div>';
  }

  /* ---------- 路線與說明 ---------- */
  function renderGuide() {
    var cur = currentPhase(), html = backHead('路線與說明') + '<div class="sec" style="margin-top:0"><h2>四個階段</h2><div class="stops">';
    PHASES.forEach(function (p, i) {
      html += '<div class="stop' + (i === cur ? ' now' : '') + '" style="--c:' + p.c + '"><span class="pi">' + use(p.ic, '0 0 48 48') + '</span><div><b>' + p.n + '</b><span class="d">' + p.date + (i === cur ? '．你在這裡' : '') + '</span><p>' + p.focus + '</p><p class="sub-note">新課：' + p.target + '</p></div></div>';
    });
    html += '</div><p class="sub-note" style="margin-top:10px">考試日暫定 2027/5/15，簡章公布後校準。階段 B、C 的堂數是粗略分配，12/6 評估後再調整。</p></div>' +
      '<div class="sec"><h2>考試重點</h2><div class="split" role="img" aria-label="筆試 80%，口試 20%"><span class="w" style="flex:80">筆試 80%</span><span class="o" style="flex:20">口試 20%</span></div><ul class="facts">' +
      '<li><b>筆試四科：國文 20%、英文 20%、專業 A 30%、專業 B 30%</b><span>專業 A ＝ 行政學概要＋法律常識；專業 B ＝ 企業管理概論。</span></li>' +
      '<li><b>專業 A：單選 50 題，每題 2 分，答錯倒扣三分之一</b><span>109 年試題為準。完全沒把握時，猜與不猜期望相同；四選一能排除至少一個選項再作答就划算。</span></li>' +
      '<li><b>國文是寫作題</b><span>115 年起改為純寫作，沒有選擇題可以刷，要靠手寫練習。</span></li>' +
      '<li><b>口試佔 20%</b><span>4 月起要排進口試準備。</span></li></ul></div>' +
      '<div class="sec"><h2>阿摩刷題三步驟</h2><ol class="steps"><li><b>計時做題 20–30 題</b>不限已上課範圍，沒上過的當預習。</li><li><b>立刻看詳解</b>把答錯的題目標記起來。</li><li><b>錯題分兩類處理</b>見下方。</li></ol></div>' +
      '<div class="sec"><h2>錯題怎麼分</h2><div class="vs"><div class="a"><b>已上過的內容</b>私人筆記寫一句話：為什麼錯＋正確觀念，30 字內。隔 1、3、7 天用「錯題」模式重測，連續兩次答對就退役。</div><div class="b"><b>還沒上過的內容</b>只看詳解，標「待上課」。不寫理由、不重測，上完該單元再重測。</div></div></div>' +
      '<div class="sec"><h2>小提醒</h2><ul class="tips"><li>整份試卷的分數階段 A 只當基準線，課程上完（階段 C 以後）再用分數判斷落點。</li><li>阿摩部分模式標示為 VIP，可能顯示 Y 幣費用，詳解也有詳解卡。先試用，確認付費範圍再決定。</li><li>阿摩上的英文與法律常識題庫名稱還沒確認，找不到就改用班內題本。</li><li>每堂課約 3 小時（依英文剩 2 堂約 6 小時推估）；復原期約 4 週，階段 A 可整段順延。</li></ul></div>';
    $('v-guide').innerHTML = html;
  }

  /* ---------- 單日頁 ---------- */
  function renderDay() {
    var d = S.route.d, box = $('v-day');
    if (!d) { box.innerHTML = ''; return; }
    var wd = weekDay(d), key = dkey(d), done = dayDone(key), ro = readOnly();
    var isToday = diffDays(d, S.today) === 0, future = diffDays(d, S.today) > 0, prev = addDays(d, -1), next = addDays(d, 1);
    var pn = '<span class="dp-pn">' + (diffDays(prev, START) >= 0 ? '<a class="pill-link" href="' + dayHref(prev) + '">‹ 前一天</a>' : '') + (diffDays(next, START) < WEEKS.length * 7 ? '<a class="pill-link" href="' + dayHref(next) + '">後一天 ›</a>' : '') + '</span>';
    var html = '<div class="page-head"><a class="pill-link" href="#week">← 本週行程</a>' + pn + '</div><div class="card">' +
      '<div class="m-date"><span class="dp-date">' + md(d) + '</span><span>週' + WD[d.getDay()] + (isToday ? '．今天' : '') + '</span></div><p class="dp-week">' + wd.w.label + '　' + wd.w.sub + '</p>';
    if (!wd.item) html += '<p class="task" style="margin-top:14px;font-size:20px">這天是休息日。好好恢復也是任務。</p>';
    else {
      var items = S.light ? [taskText(wd.item)] : wd.item[1].split('→'), steps = '';
      items.forEach(function (x) { steps += '<li>' + x + '</li>'; });
      html += '<div style="margin-top:12px">' + subTag(wd.item[0]) + '</div>' + (S.light ? '<p class="light-note">' + LIGHT_NOTE + '</p>' : '') + '<ol class="dp-steps">' + steps + '</ol>' +
        (S.light ? '' : '<p class="bonus" style="margin:0 0 16px">' + wd.w.bonus + '</p>') +
        '<button class="btn" data-day="' + key + '" data-label="' + md(d) + '" aria-pressed="' + done + '"' + (ro || future ? ' disabled' : '') + '>' + (done ? '✔ 這天完成了' : '完成了！') + '</button>' +
        (future ? '<p class="sub-note" style="margin-top:10px">還沒到這一天，到了才能標記完成。</p>' : '') +
        '<div class="sub">' + lightSwitch() + '</div>' + streakHtml() +
        (done ? '<svg class="stamp" viewBox="0 0 100 100" role="img" aria-label="花丸：完成"><use href="#hanamaru"/></svg>' : '');
    }
    box.innerHTML = html + '</div>';
  }

  function render() {
    var a = document.activeElement, sel = null, scope = null;
    if (a && a.dataset) {
      var sc = a.closest('.view'); scope = sc ? '#' + sc.id : null;
      if (a.dataset.lect) sel = '[data-lect="' + a.dataset.lect + '"]';
      else if (a.dataset.day) sel = '[data-day="' + a.dataset.day + '"]';
      else if (a.dataset.sub) sel = '[data-sub="' + a.dataset.sub + '"]';
      else if (a.dataset.wk) sel = '[data-wk="' + a.dataset.wk + '"]';
      else if (a.dataset.light !== undefined) sel = '[data-light]';
    }
    renderHome(); renderWeek(); renderProgress(); renderBirds(); renderGuide(); renderDay(); setSync();
    if (sel) { var root = scope ? document.querySelector(scope) : document, el = root && root.querySelector(sel); if (el && !el.disabled) el.focus({ preventScroll: true }); }
  }

  /* ---------- 路由 ---------- */
  var VIEWS = ['home', 'week', 'progress', 'birds', 'guide', 'day'];
  function parseRoute() {
    var h = location.hash, m = /^#day-(\d{4})(\d{2})(\d{2})$/.exec(h);
    if (m) { var d = new Date(+m[1], +m[2] - 1, +m[3]), n = diffDays(d, START); if (d.getMonth() === +m[2] - 1 && n >= 0 && n < WEEKS.length * 7) return { v: 'day', d: d }; return { v: 'home' }; }
    var name = h.slice(1);
    return { v: ['week', 'progress', 'birds', 'guide'].indexOf(name) >= 0 ? name : 'home' };
  }
  function applyRoute(fromNav) {
    S.route = parseRoute();
    if (S.route.v === 'day') S.week = weekDay(S.route.d).wi;
    VIEWS.forEach(function (v) { $('v-' + v).hidden = v !== S.route.v; });
    render();
    if (fromNav) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', function () { applyRoute(true); });

  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-lect]')) && !t.disabled) toggleLect(t.dataset.lect);
    else if ((t = e.target.closest('[data-day]')) && !t.disabled) toggleDay(t.dataset.day, t.dataset.label);
    else if ((t = e.target.closest('[data-light]'))) setLight(!S.light);
    else if ((t = e.target.closest('[data-wk]')) && !t.disabled) { S.week = Math.max(0, Math.min(WEEKS.length - 1, S.week + (+t.dataset.wk))); render(); }
    else if ((t = e.target.closest('[data-sub]'))) { S.openSub = S.openSub === t.dataset.sub ? null : t.dataset.sub; render(); }
    else if ((t = e.target.closest('[data-href]')) && !e.target.closest('a, button')) location.hash = t.dataset.href;
  });

  applyRoute(false);
  setInterval(function () { var n = dayStart(new Date()); if (diffDays(n, S.today) !== 0) { S.today = n; render(); } }, 60000);

  function goLocal() { S.mode = 'local'; S.lect = lsGet('tp_lectures'); S.days = lsGet('tp_days'); render(); }
  var slowTimer = setTimeout(function () { if (!S.live) { S.mode = 'slow'; setSync(); } }, 10000);
  Promise.all([window.claude ? window.claude.use('db') : Promise.resolve(null), window.claude ? window.claude.use('user') : Promise.resolve(null)]).then(function (r) {
    var db = r[0], user = r[1];
    if (!db) { clearTimeout(slowTimer); goLocal(); return; }
    S.db = db;
    if (user) { try { var cw = user.can('data.write'); S.canWrite = (cw === undefined ? null : cw); } catch (e) {} }
    refs.lectures = db.doc('progress/lectures'); refs.days = db.doc('progress/days');
    var got = { lectures: false, days: false };
    function onSnap(name, target) {
      return function (snap) {
        S[target] = snap.exists ? (snap.data() || {}) : {};
        got[name] = !snap.metadata.fromCache || got[name];
        if (got.lectures && got.days) { S.live = true; clearTimeout(slowTimer); S.mode = 'live'; }
        render();
      };
    }
    function onErr() { clearTimeout(slowTimer); if (!S.live) goLocal(); else { S.mode = 'slow'; setSync(); } }
    refs.lectures.onSnapshot(onSnap('lectures', 'lect'), onErr);
    refs.days.onSnapshot(onSnap('days', 'days'), onErr);
  }).catch(function () { clearTimeout(slowTimer); goLocal(); });
})();
</script>

</body></html>
