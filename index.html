<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>寶B愛大便</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 簡化版：首頁只有「今天要做什麼」＋四個大入口，其餘內容各自一頁。日系繪本風、單一淺色。 */
:root {
  --paper: #FFFCF6; --ink: #3E3A39;
  --coral: #F2A497; --yolk: #F6D27A; --sky: #A8D3E6; --leaf: #B9DAA5;
  --coral-t: #FCE4DE; --yolk-t: #FCF1CF; --sky-t: #E4F2F8; --leaf-t: #EAF4E2; --beige: #F1E9DA; --white: #FFFFFF;
  --mute: #6E6560; --r: 26px;
  --f: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.75; font-weight: 400; font-synthesis: none; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; font-weight: 400; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.wrap { max-width: 720px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { position: relative; background: var(--white); border: 3px solid var(--ink); border-radius: var(--r); padding: 22px; min-width: 0; }
.mk { box-shadow: inset 0 -0.5em 0 var(--coral); padding: 0 .12em; }

/* 頂欄 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 3px solid var(--ink); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 9px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 18px; text-decoration: none; white-space: nowrap; }
.brand svg { width: 32px; height: 32px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.4; padding: 2px 12px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 99px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mute); border: 2px solid var(--ink); flex: none; }
.sync[data-s="live"] .dot { background: var(--leaf); }
.sync[data-s="local"] .dot, .sync[data-s="slow"] .dot { background: var(--yolk); }
.sync[data-s="ro"] .dot { background: var(--sky); }

main .wrap { padding-block: 22px 8px; }
.view[hidden] { display: none; }
.pill-link { display: inline-block; padding: 3px 16px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--white); text-decoration: none; font-size: 15px; line-height: 1.6; }
.pill-link:hover { background: var(--yolk-t); }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.page-title { font-size: 26px; line-height: 1.3; }
.sub-note { color: var(--mute); font-size: 14.5px; }
.tag { display: inline-block; font-size: 13px; line-height: 1.5; padding: 0 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--c, var(--white)); white-space: nowrap; }
.s-zh { --c: var(--coral); } .s-en { --c: var(--sky); } .s-bm { --c: var(--yolk); } .s-pa { --c: var(--leaf); } .s-law, .s-misc { --c: var(--beige); }

/* 首頁 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
h1 { font-size: clamp(30px, 7vw, 40px); line-height: 1.3; }
.status { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; }
.status b { font-weight: 400; font-size: 24px; }
.mini-bat { display: inline-flex; align-items: center; }
.mini-bat .cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 90px; padding: 3px; border: 2.5px solid var(--ink); border-radius: 9px; background: var(--white); }
.mini-bat .cells i { height: 12px; border-radius: 3px; background: var(--beige); }
.mini-bat .cells i.on { background: var(--coral); }
.mini-bat .nub { width: 5px; height: 10px; border: 2.5px solid var(--ink); border-left: 0; border-radius: 0 4px 4px 0; background: var(--white); }
.scene { display: block; width: 190px; max-width: 38%; height: auto; flex: none; }

.today { padding: 24px 22px; }
.today .lab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--mute); }
.today .lab b { font-weight: 400; color: var(--ink); font-size: 22px; }
.today .task { margin: 14px 0 20px; font-size: 24px; line-height: 1.6; text-wrap: pretty; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; padding: 8px 24px; border: 3px solid var(--ink); border-radius: 99px; background: var(--coral); font-size: 20px; }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn[aria-pressed="true"] { background: var(--leaf); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.today .sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.switch { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 2px 16px 2px 10px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--white); font-size: 14.5px; }
.switch svg { width: 30px; height: 22px; flex: none; }
.switch[aria-pressed="true"] { background: var(--sky); }
.link { font-size: 14.5px; }
.light-note { margin-top: 12px; padding: 8px 14px; border: 2.5px dashed var(--ink); border-radius: 16px; background: var(--sky-t); font-size: 14px; }
.stamp { position: absolute; right: 16px; top: -28px; width: 88px; height: 88px; transform: rotate(-10deg); pointer-events: none; }
.streak { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; color: var(--mute); }
.pips { display: flex; gap: 5px; }
.pip { width: 16px; height: 16px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); }
.pip.on { background: var(--yolk); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--c); text-decoration: none; min-width: 0; }
.tile:hover { transform: translateY(-2px); }
.tile .ti { width: 46px; height: 46px; border: 3px solid var(--ink); border-radius: 50%; background: var(--white); display: grid; place-items: center; }
.tile .ti svg { width: 28px; height: 28px; }
.tile b { font-weight: 400; font-size: 20px; line-height: 1.3; margin-top: 6px; }
.tile small { font-size: 13.5px; line-height: 1.5; opacity: .85; }
.t1 { --c: var(--yolk-t); } .t2 { --c: var(--coral-t); } .t3 { --c: var(--sky-t); } .t4 { --c: var(--leaf-t); }

/* 本週行程 */
.wk { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.wk .arrow { width: 44px; height: 44px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); font-size: 20px; line-height: 1; }
.wk .arrow:disabled { opacity: .35; cursor: not-allowed; }
.wk .mid { text-align: center; }
.wk .mid b { display: block; font-weight: 400; font-size: 20px; }
.list { margin-top: 16px; padding: 6px 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-top: 2.5px solid var(--paper); }
.row + .row { border-top: 2.5px dashed var(--beige); }
.row:first-child { border-top: 0; }
.row.today { background: var(--yolk-t); }
.row.rest { cursor: default; color: var(--mute); }
.rd { flex: none; width: 52px; font-size: 20px; line-height: 1.2; }
.rd small { display: block; font-size: 12.5px; color: var(--mute); }
.rb { flex: 1; min-width: 0; font-size: 15px; line-height: 1.6; }
.rb .tag { margin-bottom: 2px; }
.rb span.t { display: block; }
.check { flex: none; width: 44px; height: 44px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); font-size: 22px; line-height: 1; }
.check[aria-pressed="true"] { background: var(--leaf); }
.check:disabled { opacity: .4; cursor: not-allowed; }
.bonus { margin-top: 14px; padding: 10px 16px; border: 2.5px dashed var(--ink); border-radius: 18px; background: var(--yolk-t); font-size: 14.5px; }

/* 課程進度 */
.subj { padding: 0; margin-bottom: 14px; overflow: hidden; }
.subj > button { display: block; width: 100%; padding: 16px 20px; border: 0; background: transparent; text-align: left; }
.subj .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.subj .hd b { font-weight: 400; font-size: 20px; }
.subj .hd span { font-size: 18px; }
.meter { height: 16px; margin-top: 10px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); border-right: 2.5px solid var(--ink); border-radius: 0 99px 99px 0; transition: width .4s ease; }
.meter i.z { border-right: 0; }
.subj.s-zh { --cd: #EC7F6C; } .subj.s-en { --cd: #5DAAD0; } .subj.s-bm { --cd: #F0B422; } .subj.s-pa { --cd: #7DBB5F; } .subj.s-law { --cd: #C9A27E; }
.meter { height: 20px; background: #E9DFCB; }
.meter i { background: var(--cd, var(--c)); }
.lect[aria-pressed="true"] { background: var(--cd, var(--c)); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; justify-items: center; padding: 4px 20px 20px; }
.lect { width: 44px; height: 44px; padding: 0; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--white); font-size: 15px; }
.lect:disabled { cursor: not-allowed; opacity: .75; }

/* 禮物 */
.ballrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
.ball svg { width: 34px; height: 34px; display: block; }
.ball { border: 2.5px solid var(--ink); border-radius: 50%; background: var(--beige); padding: 3px; }
.ball.on { background: var(--yolk); }
.gift-list { display: grid; gap: 12px; margin-top: 16px; }
.gift { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 3px solid var(--ink); border-radius: 22px; background: var(--beige); border-style: dashed; }
.gift.readyx { background: var(--yolk-t); border-style: solid; }
.gift.given { background: var(--leaf-t); border-style: solid; }
.gift .gi { flex: none; width: 52px; height: 52px; border: 3px solid var(--ink); border-radius: 50%; background: var(--white); display: grid; place-items: center; }
.gift.lock .gi { background: #E3DBCB; }
.gift .gi svg { width: 34px; height: 34px; }
.gift .gb { flex: 1; min-width: 0; }
.gift .gb b { display: block; font-weight: 400; font-size: 17px; }
.gift .gb small { display: block; color: var(--mute); font-size: 13.5px; }
.gift button { flex: none; font: inherit; font-size: 14px; padding: 8px 14px; min-height: 44px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--white); color: var(--ink); cursor: pointer; }
.gift button:disabled { opacity: .5; cursor: default; }

/* 單日頁 */
.dp-date { font-size: clamp(54px, 15vw, 80px); line-height: 1.1; }
.dp-week { margin-top: 2px; color: var(--mute); font-size: 14.5px; }
.dp-steps { display: grid; gap: 12px; margin: 18px 0; counter-reset: s; }
.dp-steps li { counter-increment: s; position: relative; padding: 12px 16px 12px 58px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--paper); font-size: 18px; line-height: 1.7; }
.dp-steps li::before { content: counter(s); position: absolute; left: 14px; top: 12px; width: 32px; height: 32px; display: grid; place-items: center; font-size: 18px; background: var(--yolk); border: 2.5px solid var(--ink); border-radius: 50%; }
.dp-pn { display: flex; gap: 8px; }
.m-date { display: flex; align-items: baseline; gap: 12px; }

/* 說明頁 */
.sec { margin-top: 26px; }
.sec h2 { font-size: 21px; margin-bottom: 10px; }
.stops { display: grid; gap: 12px; }
.stop { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 3px solid var(--ink); border-radius: 22px; background: var(--white); }
.stop.now { background: var(--yolk-t); }
.stop .pi { flex: none; width: 46px; height: 46px; border: 3px solid var(--ink); border-radius: 50%; background: var(--c); display: grid; place-items: center; }
.stop .pi svg { width: 28px; height: 28px; }
.stop b { font-weight: 400; font-size: 18px; }
.stop .d { color: var(--mute); font-size: 13px; margin-left: 6px; }
.stop p { font-size: 14.5px; margin-top: 2px; }
.facts, .tips { display: grid; gap: 12px; }
.facts li, .tips li { padding: 12px 16px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--white); font-size: 15px; }
.facts b { display: block; font-weight: 400; font-size: 16.5px; }
.facts span { color: var(--mute); font-size: 14px; }
.split { display: flex; height: 38px; border: 3px solid var(--ink); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.split span { display: flex; align-items: center; padding-left: 16px; font-size: 15px; white-space: nowrap; overflow: hidden; }
.split .w { background: var(--coral); border-right: 3px solid var(--ink); } .split .o { background: var(--yolk); }
.steps { display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 10px 16px 10px 56px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--white); font-size: 15px; }
.steps li::before { content: counter(s); position: absolute; left: 14px; top: 10px; width: 30px; height: 30px; display: grid; place-items: center; font-size: 16px; background: var(--yolk); border: 2.5px solid var(--ink); border-radius: 50%; }
.steps b { display: block; font-weight: 400; font-size: 16.5px; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vs > div { padding: 12px 14px; border: 2.5px solid var(--ink); border-radius: 18px; font-size: 14.5px; }
.vs b { display: block; font-weight: 400; font-size: 16px; margin-bottom: 4px; }
.vs .a { background: var(--leaf-t); } .vs .b { background: var(--yolk-t); }
.tips li { list-style: none; font-size: 14.5px; }

footer { margin-top: 34px; color: var(--mute); font-size: 13.5px; }
footer .wrap { padding-block: 14px 34px; }
.hills { display: block; width: 100%; height: 64px; }
.feed { position: fixed; z-index: 40; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.feed div { background: var(--yolk); border: 3px solid var(--ink); border-radius: 99px; padding: 6px 18px; font-size: 14.5px; max-width: min(92vw, 360px); animation: pop .25s ease-out; }
.feed div.err { background: var(--coral); }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } }

.debt { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 10px 16px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--yolk-t); font-size: 14.5px; }
.debt b { font-weight: 400; font-size: 15.5px; }
.debt.ok { background: var(--leaf-t); } .debt.hi { background: var(--coral-t); }
.set { display: grid; gap: 12px; }
.set label { display: grid; gap: 4px; font-size: 14.5px; }
.set input { font: inherit; padding: 8px 12px; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--paper); color: var(--ink); min-height: 44px; max-width: 100%; }
@media (max-width: 520px) {
  .scene { display: none; }
  .today .task { font-size: 22px; }
  .vs { grid-template-columns: minmax(0, 1fr); }
  .stamp { width: 76px; height: 76px; top: -30px; }
}
</style>

<script>

  var LESSONS = [];

  var CN = { '英文': '英文', '企管': '企管', '行政學': '行政學', '法律': '法律常識' };

  var OLD = {

  };
  var BASE_AFTER = [3, 4, 4, 3, 4, 3, 3, 3, 3, 4, 3, 4, 3, 3];
  var SPRING = new Date(2027, 1, 8);

  function Q(s, n) { return '阿摩' + CN[s] + '題 ' + n + ' 題'; }

    var o = OLD[ph][di]; if (!o) return '';

    return Q(o, 10) + '（舊科目複習' + (o === '行政學' ? '，已上過的單元' : '') + '），看詳解';
  }
  function lessonFull(l) { return '看' + CN[l.subj] + '第 ' + l.n + ' 堂上半（約 70 分鐘，1.25 倍速）→ 休息 30 分鐘以上 → 看' + CN[l.subj] + '第 ' + l.n + ' 堂下半（約 70 分鐘）'; }
  function lessonHalf(h) { return '看' + CN[h.l.subj] + '第 ' + h.l.n + ' 堂' + h.p + '（約 70 分鐘，1.25 倍速）'; }
  function item(tag, steps, light, short) { return [tag, steps.filter(Boolean).join(' → '), light, short]; }
  function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function rangeText(ls) {
    var out = [], cur = null;
    ls.forEach(function (l) {
      if (cur && cur.subj === l.subj && cur.b + 1 === l.n) cur.b = l.n;
      else { cur = { subj: l.subj, a: l.n, b: l.n }; out.push(cur); }

  function homeDay(di, l, ph) {

  }
  var WED = [
    ['挑 3 個作文架構，各寫 1 個破題句', '錯題本第一次示範：和寶B一起，從這週標記的錯題挑約 10 題，打字、列印、剪下、貼進筆記本，再手寫詳解（約 60 分鐘）'],
    ['3 個題目只寫大綱（每題 15 分鐘）', '錯題本：每個單元約 15 題，自己完成「挑題 → 打字列印 → 剪貼 → 手寫詳解」，寶B再檢查'],
    ['限時作文 1 篇（60 分鐘）', '錯題本：補上先前標「待上課」、現在已經上過的錯題，並寫上詳解'],
    ['作文 1 篇，對照講義架構自評', '錯題本整理與盤點：加目錄、分科頁籤，算一下總題數，連續兩次答對的題打勾「退役」']
  ];
  function homeWed(n) {
    var w = WED[Math.min(n - 1, WED.length - 1)];
    if (n > WED.length) w = ['限時作文 1 篇（60 分鐘）', '錯題本：整理這週已上過的錯題，並寫上詳解'];
    return item('國文', ['國文：' + w[0], w[1]], '只挑 1 個作文題目，寫出大綱或一句破題（15 分鐘內）。', '國文＋錯題本');
  }
  function flex(ph, di) {
    return item('總整理', ['彈性日：先補這週沒看完的半堂', '沒有欠課就做阿摩題 20 題（科目照說明頁的輪替）', '順手整理錯題本'], '做阿摩題 10 題，看詳解就好。', '彈性日：補課或阿摩 20 題');
  }
  function evening(ph, di, h) {
    var s = h.l.subj;
    return item(s, [lessonHalf(h), Q(s, 10) + '，看詳解（對應今天的內容）', oldQ(ph, di, s), '錯的題目在阿摩標記，週六再整理'],

  }

    return item(s, ['週日也排了半堂：' + lessonHalf(h), Q(s, 10) + '，看詳解', '看一下首頁的「欠課帳」'],
      '只看' + CN[s] + '第 ' + h.l.n + ' 堂' + h.p + '（約 70 分鐘）。', CN[s] + '第 ' + h.l.n + ' 堂' + h.p);
  }
  function saturday(ph, hs) {
    var tag = hs.length ? hs[0].l.subj : '總整理', lec;
    if (hs.length === 2 && hs[0].l === hs[1].l) lec = lessonFull(hs[0].l);

      '錯題本：把這週標記的錯題挑出來，打字、列印、剪貼，手寫詳解（約 60 分鐘）；還沒上到的內容標「待上課」，先不貼', '阿摩「錯題」模式重測這週已上過的錯題（約 30 分鐘）'],

  }

  function homeWeek(n, ls) {
    var days = [null, null, null, null, null, null, null], slots = [0, 1, 3, 4, 5];
